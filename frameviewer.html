<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Frame Test Viewer v2 — C.Barnickel</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2018;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #stage { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #panel {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    background: rgba(15,12,10,0.82); color: #e6d8c4;
    border: 1px solid rgba(201,169,110,0.4); border-radius: 12px;
    padding: 14px 16px; font-size: 13px; line-height: 1.7;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); max-width: 250px;
  }
  #panel h1 { font-size: 14px; margin: 0 0 8px; color: #e6c885; font-weight: 600; }
  .stat { color: #b8a888; }
  .row { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  button { background: rgba(40,32,24,0.9); color: #e6d8c4;
    border: 1px solid rgba(201,169,110,0.35); border-radius: 7px;
    padding: 7px 11px; font-size: 12px; cursor: pointer; transition: all .15s;
    -webkit-tap-highlight-color: transparent; }
  button:hover, button.on { color: #1a1410; background: #e6c885; border-color: #e6c885; }
  .swatch { width: 22px; height: 22px; padding: 0; border-radius: 50%; }
  #hint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 10; color: #b8a888; font-size: 12px; background: rgba(15,12,10,0.7);
    padding: 7px 14px; border-radius: 20px; }
  #err { position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: #5a1414; color: #ffd0d0; font-size: 13px; padding: 10px 14px;
    font-family: monospace; display: none; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="err"></div>
<div id="panel">
  <h1>Frame Test Viewer v2</h1>
  <div class="stat" id="stats">starting…</div>
  <div class="row" id="colors">
    <button class="swatch on" style="background:#6f8fb7" data-c="6f8fb7" title="Pastel blue"></button>
    <button class="swatch" style="background:#dfe6ea" data-c="dfe6ea" title="Cream"></button>
    <button class="swatch" style="background:#9fb8a7" data-c="9fb8a7" title="Sage"></button>
    <button class="swatch" style="background:#a07b3a" data-c="a07b3a" title="Gilt"></button>
    <button class="swatch" style="background:#141210" data-c="141210" title="Black"></button>
  </div>
  <div class="row">
    <button id="wire">Wireframe</button>
    <button id="spin" class="on">Auto-spin</button>
  </div>
  <div class="row">
    <button id="metal">Metalness</button>
    <button id="bg">BG tone</button>
  </div>
</div>
<div id="hint">drag to rotate · scroll/pinch to zoom · two-finger drag to pan</div>

<script>
// Global error trap → show on screen instead of failing silently
const errBox = document.getElementById('err');
function showErr(msg){ errBox.style.display='block'; errBox.textContent += msg + '\n'; }
window.addEventListener('error', e => showErr('JS error: ' + (e.message || e.error) + (e.filename ? '  ['+e.filename+':'+e.lineno+']' : '')));
window.addEventListener('unhandledrejection', e => showErr('Promise rejection: ' + e.reason));
</script>

function boot() {
  // Guard: confirm libraries actually loaded
  if (typeof THREE === 'undefined') { showErr('THREE failed to load (CDN blocked or offline).'); return; }
  if (typeof THREE.GLTFLoader === 'undefined') { showErr('GLTFLoader failed to load from CDN.'); return; }
  if (typeof THREE.OrbitControls === 'undefined') { showErr('OrbitControls failed to load from CDN.'); return; }

  const canvas = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  const bgTones = [0x2a2018, 0x4a352b, 0x1a1a1a, 0xf2efe6];
  let bgIdx = 0;
  scene.background = new THREE.Color(bgTones[bgIdx]);

  const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.01, 100);
  camera.position.set(0, 0, 4.2);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.SpotLight(0xfff1d8, 8, 20, Math.PI/5, 0.5, 1.5);
  key.position.set(2, 5, 4); scene.add(key);
  const rim = new THREE.DirectionalLight(0x88aaff, 0.5); rim.position.set(-3, 1, -2); scene.add(rim);
  const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(0, -2, 3); scene.add(fill);

  let frameRoot = null;
  const mat = new THREE.MeshStandardMaterial({ color: 0x6f8fb7, roughness: 0.55, metalness: 0.05 });

  function b64ToBuffer(b64){
    const bin = atob(b64); const len = bin.length; const bytes = new Uint8Array(len);
    for (let i=0;i<len;i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  const stats = document.getElementById('stats');
  stats.textContent = 'parsing model…';
  try {
    new THREE.GLTFLoader().parse(b64ToBuffer(GLB_B64), '', (gltf) => {
      const model = gltf.scene;
      let tris = 0;
      model.traverse(o => {
        if (o.isMesh) {
          o.material = mat;
          o.geometry.computeVertexNormals();
          if (o.geometry.index) tris += o.geometry.index.count/3;
          else if (o.geometry.attributes.position) tris += o.geometry.attributes.position.count/3;
        }
      });
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      model.position.sub(center);
      frameRoot = model;
      scene.add(model);
      const fitH = size.y * 1.15;
      const dist = (fitH/2) / Math.tan((camera.fov*Math.PI/180)/2);
      camera.position.set(0, 0, dist);
      controls.target.set(0,0,0); controls.update();
      stats.innerHTML = Math.round(tris).toLocaleString() + ' triangles<br>size ' +
        size.x.toFixed(2)+' × '+size.y.toFixed(2)+' × '+size.z.toFixed(2);
    }, (err) => { showErr('GLTF parse failed: ' + err); stats.textContent = 'parse failed'; });
  } catch (e) { showErr('parse threw: ' + e.message); }

  let spin = true;
  document.getElementById('spin').onclick = e => { spin=!spin; e.target.classList.toggle('on',spin); };
  document.getElementById('wire').onclick = e => { mat.wireframe=!mat.wireframe; e.target.classList.toggle('on',mat.wireframe); };
  let metalOn=false;
  document.getElementById('metal').onclick = e => { metalOn=!metalOn; mat.metalness=metalOn?0.6:0.05; mat.roughness=metalOn?0.35:0.55; e.target.classList.toggle('on',metalOn); };
  document.getElementById('bg').onclick = () => { bgIdx=(bgIdx+1)%bgTones.length; scene.background=new THREE.Color(bgTones[bgIdx]); };
  document.querySelectorAll('.swatch').forEach(b => { b.onclick = () => {
    document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('on'));
    b.classList.add('on'); mat.color.setHex(parseInt(b.dataset.c,16));
  }; });

  function animate(){
    requestAnimationFrame(animate);
    if (spin && frameRoot) frameRoot.rotation.y += 0.005;
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

// Boot after load so the CDN scripts are present
if (document.readyState === 'complete') boot();
else window.addEventListener('load', boot);
</script>
