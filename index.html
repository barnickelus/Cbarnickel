     C.BARNICKEL FRAME PATCH  v2
     Paste this block just before </body> in index.html
     Fixes: Gothic gaps, frame shadow, more colors
     ═══════════════════════════════════════════════════════════ -->

<script>
/* ─────────────────────────────────────────────────────────────
   1.  GOTHIC FRAME — single-piece ExtrudeGeometry (NO GAPS)
   Replaces the old version that had separate bottom/side rails
   that didn't perfectly join the arch ExtrudeGeometry.
─────────────────────────────────────────────────────────────── */
window._patchGothic = function buildGothicFrame(group, pW, pH, mat) {
  const thk   = Math.max(0.08, Math.min(0.14, pH * 0.085));
  const depth  = 0.065;

  // Arch geometry
  const springY   = pH / 2 + thk;               // where arch springs from top of side rails
  const peakRise  = Math.min(pW * 0.38, pH * 0.32);
  const peakY     = springY + peakRise;
  const outerW    = pW / 2 + thk;
  const bottomY   = -pH / 2 - thk;

  // — OUTER shape (full silhouette) —
  const outer = new THREE.Shape();
  outer.moveTo(-outerW, bottomY);
  outer.lineTo( outerW, bottomY);
  outer.lineTo( outerW, springY);
  // right arch → peak  (cubic gives nicer Gothic ogee lean)
  outer.bezierCurveTo(
     outerW,  springY + peakRise * 0.55,
     outerW * 0.25, peakY,
     0,        peakY
  );
  // peak → left arch
  outer.bezierCurveTo(
    -outerW * 0.25, peakY,
    -outerW,  springY + peakRise * 0.55,
    -outerW,  springY
  );
  outer.lineTo(-outerW, bottomY);

  // — INNER hole (painting opening with matching inner arch) —
  const innerW      = pW / 2;
  const innerBottom = -pH / 2;
  const innerSpring = pH / 2;
  const innerPeak   = innerSpring + peakRise * 0.80;

  const hole = new THREE.Path();
  hole.moveTo(-innerW, innerBottom);
  hole.lineTo( innerW, innerBottom);
  hole.lineTo( innerW, innerSpring);
  hole.bezierCurveTo(
     innerW,  innerSpring + peakRise * 0.50,
     innerW * 0.22, innerPeak,
     0,        innerPeak
  );
  hole.bezierCurveTo(
    -innerW * 0.22, innerPeak,
    -innerW,  innerSpring + peakRise * 0.50,
    -innerW,  innerSpring
  );
  hole.lineTo(-innerW, innerBottom);
  outer.holes.push(hole);

  const geo = new THREE.ExtrudeGeometry(outer, {
    depth,
    bevelEnabled: true,
    bevelThickness: depth * 0.20,
    bevelSize: 0.007,
    bevelSegments: 4,
  });
  geo.translate(0, 0, -depth * 0.5);

  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = false;
  group.add(mesh);

  // Slim pointed finial at apex
  const finH = thk * 0.9;
  const fin  = new THREE.Mesh(
    new THREE.ConeGeometry(thk * 0.16, finH, 8),
    mat
  );
  fin.position.set(0, peakY + finH * 0.5, 0);
  group.add(fin);

  // Small side finials at the arch spring points
  for (const sx of [-1, 1]) {
    const sf = new THREE.Mesh(
      new THREE.ConeGeometry(thk * 0.10, finH * 0.6, 6),
      mat
    );
    sf.position.set(sx * outerW * 0.92, springY + finH * 0.3, 0);
    group.add(sf);
  }

  group.userData.frameDepth = depth;
  group.userData.frameStyle  = 'gothic';
  group.userData.archPeakY   = peakY;   // used by shadow helper
};

/* ─────────────────────────────────────────────────────────────
   2.  FRAME SHADOW PLANE
   A soft dark quad placed just behind each frame, slightly
   larger + offset down-right like a cast shadow from above-left.
   Uses MeshBasicMaterial so it works on all iOS Safari.
─────────────────────────────────────────────────────────────── */
window._addFrameShadow = function addFrameShadow(group, pW, pH) {
  const thk   = Math.max(0.08, Math.min(0.14, pH * 0.085));
  const style  = group.userData.frameStyle || 'minimal';
  const depth  = group.userData.frameDepth || 0.045;

  // Base shadow bounds match frame outer + generous spread
  const spread  = 0.055;
  let shadowW   = pW + thk * 2 + spread * 2;
  let shadowH   = pH + thk * 2 + spread * 2;
  let shadowCY  = 0;

  if (style === 'gothic') {
    const peakY = group.userData.archPeakY || (pH / 2 + pH * 0.32);
    const extra = peakY - pH / 2;
    shadowH += extra;
    shadowCY = extra * 0.5;
  }
  if (style === 'ornate') {
    shadowW += thk * 0.6;
    shadowH += thk * 0.6;
  }

  // Build a simple plane with per-vertex alpha so edges fade out
  const geo  = new THREE.PlaneGeometry(shadowW, shadowH, 1, 1);
  const mat  = new THREE.MeshBasicMaterial({
    color:       0x000000,
    transparent: true,
    opacity:     0.30,
    depthWrite:  false,
  });

  const shadow = new THREE.Mesh(geo, mat);
  // Sit 4 mm BEHIND the frame front face (toward wall)
  shadow.position.set(0.012, shadowCY - 0.018, -(depth * 0.5 + 0.004));
  shadow.renderOrder = -1;
  group.add(shadow);
};

/* ─────────────────────────────────────────────────────────────
   3.  EXPANDED COLOR PALETTE
   Adds Walnut, Ebony, Bronze, Burgundy, Navy, Forest to the
   existing Auto / Black / White / Gilt buttons.
─────────────────────────────────────────────────────────────── */
window._extraColors = {
  walnut:   { hex: 0x5C3317, name: 'Walnut'   },
  ebony:    { hex: 0x1A1A1A, name: 'Ebony'    },
  bronze:   { hex: 0x8B6914, name: 'Bronze'   },
  burgundy: { hex: 0x6B1A2A, name: 'Burgundy' },
  navy:     { hex: 0x1A2B4A, name: 'Navy'     },
  forest:   { hex: 0x1E3A28, name: 'Forest'   },
};

/* ─────────────────────────────────────────────────────────────
   4.  PATCH INJECTOR
   Waits for the gallery to boot, then hooks in.
─────────────────────────────────────────────────────────────── */
(function waitAndPatch() {
  // Retry until the gallery globals exist
  if (typeof buildFrame === 'undefined'
      || typeof setFrameColor === 'undefined'
      || typeof rebuildAllFrames === 'undefined') {
    setTimeout(waitAndPatch, 200);
    return;
  }

  // ── 4a. Swap in the no-gap gothic builder ──
  const _origBuildFrame = buildFrame;
  window.buildFrame = function(group, pW, pH, mat, style) {
    if (style === 'gothic') {
      window._patchGothic(group, pW, pH, mat);
    } else {
      _origBuildFrame(group, pW, pH, mat, style);
    }
    // Always add shadow after building
    window._addFrameShadow(group, pW, pH);
  };

  // ── 4b. Patch setFrameColor to handle new colors ──
  const _origSetColor = setFrameColor;
  window.setFrameColor = function(color) {
    if (window._extraColors[color]) {
      frameSettings.color = color;
      localStorage.setItem('frameColor', color);
      rebuildAllFrames();
      // Update button active states
      document.querySelectorAll('[data-frame-color]').forEach(b => {
        b.classList.toggle('active', b.dataset.frameColor === color);
      });
    } else {
      _origSetColor(color);
    }
  };

  // ── 4c. Patch getFrameMaterial / color resolution ──
  //   We intercept the THREE.MeshStandardMaterial creation
  //   so extra colors resolve to correct hex values.
  const _origGetMat = typeof getFrameMaterial === 'function' ? getFrameMaterial : null;
  if (_origGetMat) {
    window.getFrameMaterial = function(color, isWhiteCube) {
      const extra = window._extraColors[color];
      if (extra) {
        return new THREE.MeshStandardMaterial({
          color:     extra.hex,
          roughness: color === 'ebony' ? 0.15 : 0.55,
          metalness: color === 'bronze' ? 0.70 : 0.10,
        });
      }
      return _origGetMat(color, isWhiteCube);
    };
  }

  // ── 4d. Inject new color buttons into settings panel ──
  const colorGrid = document.querySelector('[data-frame-color]')?.closest('.settings-group');
  if (colorGrid) {
    const extraRow = document.createElement('div');
    extraRow.style.cssText = 'display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px;';
    Object.entries(window._extraColors).forEach(([key, val]) => {
      const btn = document.createElement('button');
      btn.className = 'settings-btn';
      btn.dataset.frameColor = key;
      btn.textContent = val.name.toUpperCase();
      btn.style.cssText = `
        border-left: 3px solid #${val.hex.toString(16).padStart(6,'0')};
        font-size: 9px;
        padding: 6px 4px;
      `;
      btn.addEventListener('click', () => setFrameColor(key));
      extraRow.appendChild(btn);
    });
    colorGrid.appendChild(extraRow);
  }

  // ── 4e. Trigger a rebuild so changes show immediately ──
  if (typeof rebuildAllFrames === 'function') {
    rebuildAllFrames();
  }

  console.log('[PATCH] Gothic fix + shadow + 6 new colors applied ✓');
})();
</script>
