<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>C.Barnickel Artwork — Virtual Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0a0908;
  --ink: #efe7d7;
  --ink-dim: #aba194;
  --ink-faint: #5a544c;
  --gold: #c9a96e;
  --gold-dim: #8a7349;
  --rust: #a06448;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Inter', system-ui, sans-serif;
}
html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
body { overscroll-behavior: none; }

/* ─── 3D canvas ─── */
#stage {
  position: fixed; inset: 0; z-index: 1;
  touch-action: none;
}

/* ─── Entry overlay ─── */
#entry {
  position: fixed; inset: 0; z-index: 100;
  background: linear-gradient(180deg, #0a0908 0%, #15110d 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px;
  transition: opacity 0.8s ease;
}
#entry.fade { opacity: 0; pointer-events: none; }
#entry .ornament {
  width: 60px; height: 1px; background: var(--gold-dim);
  margin: 0 auto 24px;
}
#entry h1 {
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(40px, 7vw, 76px);
  letter-spacing: 0.12em;
  text-align: center;
  color: var(--ink);
  line-height: 1.1;
}
#entry h1 .dot { color: var(--gold); }
#entry .sub {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(14px, 1.6vw, 18px);
  color: var(--ink-dim);
  margin-top: 14px;
  letter-spacing: 0.04em;
  text-align: center;
}
#entry .enter-btn {
  margin-top: 60px;
  background: transparent;
  border: 1px solid var(--gold-dim);
  color: var(--gold);
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  padding: 16px 40px;
  cursor: pointer;
  transition: all 0.3s ease;
}
#entry .enter-btn:hover:not(:disabled) {
  background: rgba(201, 169, 110, 0.1);
  color: var(--ink);
  border-color: var(--gold);
}
#entry .enter-btn:disabled {
  opacity: 0.4;
  cursor: default;
}
#entry .loading-bar {
  margin-top: 24px;
  width: 200px; height: 1px;
  background: rgba(201, 169, 110, 0.15);
  position: relative;
  overflow: hidden;
}
#entry .loading-bar::after {
  content: '';
  position: absolute; inset: 0;
  background: var(--gold-dim);
  transform-origin: left;
  animation: load-pulse 1.4s ease-in-out infinite;
}
@keyframes load-pulse {
  0% { transform: scaleX(0); }
  50% { transform: scaleX(1); }
  100% { transform: scaleX(0); transform-origin: right; }
}
#entry.loaded .loading-bar { display: none; }

/* ─── Top bar ─── */
.top-bar {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 50;
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 28px;
  pointer-events: none;
}
.top-bar > * { pointer-events: auto; }
.brand {
  font-family: var(--serif);
  font-size: 14px;
  letter-spacing: 0.28em;
  color: var(--ink);
  text-transform: uppercase;
  user-select: none;
}
.brand .dot { color: var(--gold); }
.brand .suffix { opacity: 0.65; margin-left: 4px; }

.right-group { display: flex; align-items: center; gap: 12px; }
.view-toggle {
  display: flex;
  border: 1px solid var(--ink-faint);
  background: rgba(10, 9, 8, 0.5);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.view-toggle button {
  background: transparent;
  border: none;
  color: var(--ink-dim);
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 9px 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.view-toggle button:hover { color: var(--ink); }
.view-toggle button.active { color: var(--gold); background: rgba(201, 169, 110, 0.12); }

.icon-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid var(--ink-faint);
  background: rgba(10, 9, 8, 0.5);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--ink);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: all 0.2s;
  padding: 0;
}
.icon-btn:hover { color: var(--gold); border-color: var(--gold-dim); }
.icon-btn.active {
  color: var(--gold);
  border-color: var(--gold);
  background: rgba(201, 169, 110, 0.18);
}

/* ─── Bait button (do not click here) ─── */
.bait {
  position: fixed;
  top: 70px;
  right: 28px;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 14px;
  pointer-events: auto;
}
.bait-btn {
  width: 46px; height: 46px;
  border-radius: 50%;
  border: 1px solid var(--ink-faint);
  background: rgba(10, 9, 8, 0.5);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--ink);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.25s;
  padding: 0;
  animation: bait-pulse 2.6s ease-in-out infinite;
}
.bait-btn svg { width: 22px; height: 22px; transition: transform 0.3s; }
.bait-btn:hover { color: var(--gold); border-color: var(--gold-dim); transform: scale(1.06); }
.bait-btn.active {
  color: var(--gold);
  border-color: var(--gold);
  background: rgba(201, 169, 110, 0.2);
  animation: none;
}
.bait-btn.active svg { transform: rotate(180deg); }
@keyframes bait-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(201, 169, 110, 0); }
  50%      { box-shadow: 0 0 14px 3px rgba(201, 169, 110, 0.22); }
}
.bait-label {
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  user-select: none;
  white-space: nowrap;
}

/* ─── Weapon toolbar ─── */
.weapon-toolbar {
  position: fixed;
  top: 130px;
  right: 28px;
  z-index: 50;
  display: none;
  flex-direction: column;
  gap: 8px;
}
.weapon-toolbar.show { display: flex; }
.weapon-btn {
  width: 42px; height: 42px;
  border-radius: 50%;
  border: 1px solid var(--ink-faint);
  background: rgba(10, 9, 8, 0.5);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  color: var(--ink);
  transition: all 0.2s;
  padding: 0;
}
.weapon-btn:hover { border-color: var(--gold-dim); }
.weapon-btn.active {
  border-color: var(--gold);
  background: rgba(201, 169, 110, 0.18);
}
.weapon-btn svg { width: 20px; height: 20px; }
.weapon-divider {
  height: 1px;
  background: rgba(239, 231, 215, 0.12);
  margin: 4px 6px;
}
.weapon-btn.clear { color: var(--ink-dim); }
.weapon-btn.clear:not(:disabled):hover { color: var(--rust); border-color: var(--rust); }
.weapon-btn.clear:disabled { opacity: 0.35; cursor: not-allowed; }

/* ─── Settings panel ─── */
.settings-panel {
  position: fixed;
  top: 70px; right: 28px;
  z-index: 60;
  width: 280px;
  background: rgba(15, 12, 10, 0.96);
  border: 1px solid var(--ink-faint);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 22px 22px 18px;
  opacity: 0;
  transform: translateY(-10px);
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
}
.settings-panel.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.settings-panel h3 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 16px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 18px;
}
.settings-panel .row { margin-bottom: 16px; }
.settings-panel .row label {
  display: block;
  font-size: 9px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ink-dim);
  margin-bottom: 8px;
}
.settings-panel .row .val {
  float: right;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.settings-panel input[type="range"] {
  width: 100%; height: 2px;
  -webkit-appearance: none; appearance: none;
  background: rgba(239, 231, 215, 0.12);
  cursor: pointer;
  outline: none;
}
.settings-panel input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--gold);
  cursor: pointer;
  border: none;
}
.settings-panel input[type="range"]::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--gold); cursor: pointer; border: none;
}
.toggle-switch {
  width: 38px; height: 20px;
  background: rgba(239, 231, 215, 0.12);
  border-radius: 10px;
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
}
.toggle-switch::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--ink-dim);
  transition: all 0.2s;
}
.toggle-switch.on { background: rgba(201, 169, 110, 0.4); }
.toggle-switch.on::after { transform: translateX(18px); background: var(--gold); }

.nav-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.nav-grid button {
  background: transparent;
  border: 1px solid var(--ink-faint);
  color: var(--ink-dim);
  padding: 8px 10px;
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
}
.nav-grid button:hover { color: var(--ink); border-color: var(--gold-dim); }
.nav-grid button.active {
  background: rgba(201, 169, 110, 0.15);
  color: var(--gold);
  border-color: var(--gold);
}
.divider {
  border-top: 1px solid rgba(239, 231, 215, 0.08);
  padding-top: 16px;
  margin-top: 4px;
}

.ghost-btn {
  background: transparent;
  border: 1px solid var(--ink-faint);
  color: var(--ink-dim);
  padding: 9px 12px;
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  cursor: pointer;
  width: 100%;
  transition: all 0.2s;
}
.ghost-btn:hover { color: var(--ink); border-color: var(--gold-dim); }

/* ─── Bottom hint ─── */
.bottom-hint {
  position: fixed;
  bottom: 32px; left: 50%;
  transform: translateX(-50%);
  z-index: 40;
  pointer-events: none;
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--ink-dim);
  text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  text-align: center;
  background: rgba(10, 9, 8, 0.4);
  padding: 10px 18px;
  border: 1px solid rgba(201, 169, 110, 0.18);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 0;
  transition: opacity 0.7s ease;
  white-space: nowrap;
}
.bottom-hint.show { opacity: 1; }

/* ─── Tiny joystick (only when nav mode requires it) ─── */
.joy {
  position: fixed;
  bottom: 28px; left: 28px;
  z-index: 40;
  display: none;
  width: 100px; height: 100px;
  border-radius: 50%;
  background: rgba(10, 9, 8, 0.4);
  border: 1px solid rgba(201, 169, 110, 0.2);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  pointer-events: auto;
  touch-action: none;
}
.joy.show { display: block; }
.joy .stick {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--ink-dim);
  pointer-events: none;
  transition: transform 0.05s;
}
.joy::before {
  content: 'WALK';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, calc(-50% + 32px));
  font-size: 8px;
  letter-spacing: 0.24em;
  color: var(--ink-faint);
  pointer-events: none;
}

/* ─── Skip intro button ─── */
.skip-intro {
  position: fixed;
  bottom: 28px; right: 28px;
  z-index: 80;
  background: rgba(10, 9, 8, 0.6);
  border: 1px solid var(--gold-dim);
  color: var(--gold);
  padding: 10px 18px;
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease 1s;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.skip-intro.show { opacity: 0.85; pointer-events: auto; }
.skip-intro:hover { opacity: 1; }

/* ─── Tutorial overlay ─── */
.tutorial-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(10, 9, 8, 0.82);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: none;
  align-items: center; justify-content: center;
  padding: 20px;
}
.tutorial-overlay.show { display: flex; }
.tutorial-card {
  max-width: 460px;
  background: rgba(15, 12, 10, 0.97);
  border: 1px solid var(--gold-dim);
  padding: 36px 32px 28px;
}
.tutorial-card h3 {
  font-family: var(--serif);
  font-weight: 300;
  font-size: 22px;
  color: var(--gold);
  margin: 0 0 18px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  text-align: center;
}
.tutorial-step {
  display: flex; gap: 14px;
  margin-bottom: 14px;
}
.tutorial-step .step-icon {
  flex-shrink: 0;
  width: 36px; height: 36px;
  border: 1px solid var(--gold-dim);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--gold);
  font-size: 16px;
}
.tutorial-step .step-text { color: var(--ink-dim); line-height: 1.5; }
.tutorial-step strong { color: var(--ink); font-weight: 500; }
.tutorial-card .ghost-btn { margin-top: 18px; }

/* ─── Modal (painting detail) ─── */
.modal {
  position: fixed; inset: 0; z-index: 150;
  background: rgba(10, 9, 8, 0.94);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  align-items: center; justify-content: center;
  padding: 60px 24px;
}
.modal.show { display: flex; }
.modal-content {
  max-width: 1100px;
  width: 100%; height: 100%;
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 40px;
}
.modal-img-wrap {
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.modal-img-wrap img {
  max-width: 100%; max-height: 100%;
  object-fit: contain;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
}
.modal-info {
  display: flex; flex-direction: column; justify-content: center;
  color: var(--ink);
}
.modal-info .num {
  font-size: 9px; letter-spacing: 0.3em;
  color: var(--ink-faint); text-transform: uppercase;
  margin-bottom: 10px;
}
.modal-info h2 {
  font-family: var(--serif); font-weight: 400;
  font-size: 32px; letter-spacing: 0.04em;
  margin-bottom: 8px;
}
.modal-info .meta {
  font-style: italic;
  color: var(--ink-dim);
  margin-bottom: 4px;
}
.modal-info .size {
  font-size: 10px; letter-spacing: 0.18em;
  color: var(--ink-faint); text-transform: uppercase;
  margin-bottom: 22px;
}
.modal-info .desc {
  color: var(--ink-dim); line-height: 1.7;
  font-size: 14px;
}
.modal-close {
  position: absolute;
  top: 24px; right: 24px;
  width: 38px; height: 38px;
  border: 1px solid var(--ink-faint);
  border-radius: 50%;
  background: transparent;
  color: var(--ink); cursor: pointer;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { color: var(--gold); border-color: var(--gold); }
.modal-nav {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px;
  border: 1px solid var(--ink-faint);
  border-radius: 50%;
  background: rgba(10, 9, 8, 0.6);
  color: var(--ink); cursor: pointer;
  font-size: 20px;
  display: flex; align-items: center; justify-content: center;
}
.modal-nav:hover { color: var(--gold); border-color: var(--gold); }
.modal-nav.prev { left: 24px; }
.modal-nav.next { right: 24px; }

/* ─── Slideshow view ─── */
.slideshow {
  position: fixed; inset: 0; z-index: 30;
  display: none;
  align-items: center; justify-content: center;
  padding: 90px 24px 80px;
  background: var(--bg);
}
.slideshow.show { display: flex; flex-direction: column; }
.slide-img-wrap {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  width: 100%;
  overflow: hidden;
}
.slide-img-wrap img {
  max-width: 95%; max-height: 100%;
  object-fit: contain;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
}
.slide-info {
  text-align: center;
  margin-top: 24px;
  max-width: 720px;
}
.slide-info .num {
  font-size: 9px; letter-spacing: 0.32em; text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 6px;
}
.slide-info h2 {
  font-family: var(--serif); font-weight: 400;
  font-size: 26px; letter-spacing: 0.04em;
  color: var(--ink);
}
.slide-info .meta {
  font-style: italic; color: var(--ink-dim);
  margin-top: 4px;
}
.slide-nav {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  width: 48px; height: 48px;
  border: 1px solid var(--ink-faint);
  border-radius: 50%;
  background: rgba(10, 9, 8, 0.5);
  color: var(--ink); cursor: pointer;
  font-size: 22px;
  display: flex; align-items: center; justify-content: center;
}
.slide-nav.prev { left: 28px; }
.slide-nav.next { right: 28px; }
.slide-nav:hover { color: var(--gold); border-color: var(--gold); }

/* ─── Index view ─── */
.index-view {
  position: fixed; inset: 0; z-index: 30;
  display: none;
  background: var(--bg);
  overflow-y: auto;
  padding: 110px 32px 80px;
}
.index-view.show { display: block; }
.index-intro {
  text-align: center;
  margin-bottom: 60px;
}
.index-intro h2 {
  font-family: var(--serif); font-weight: 300;
  font-size: 36px; letter-spacing: 0.06em;
  color: var(--ink);
  margin-bottom: 8px;
}
.index-intro p {
  font-size: 13px; color: var(--ink-dim);
  letter-spacing: 0.04em;
}
.index-section {
  max-width: 1280px; margin: 0 auto 80px;
}
.index-section-header {
  text-align: center;
  margin-bottom: 48px;
}
.index-section-header .ornament {
  width: 40px; height: 1px; background: var(--gold-dim);
  margin: 0 auto 14px;
}
.index-section-header h3 {
  font-family: var(--serif); font-weight: 300;
  font-size: 28px; letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink);
}
.index-section-header .sub {
  font-style: italic; color: var(--ink-dim);
  font-size: 14px; margin-top: 4px;
}
.index-section-header .count {
  font-size: 9px; letter-spacing: 0.32em; text-transform: uppercase;
  color: var(--ink-faint);
  margin-top: 12px;
}
.index-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 48px 32px;
}
.index-card {
  cursor: pointer;
}
.index-card .img-wrap {
  background: #111;
  overflow: hidden;
  aspect-ratio: 4 / 3;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px;
}
.index-card .img-wrap img {
  max-width: 100%; max-height: 100%;
  object-fit: contain;
  transition: transform 0.5s;
}
.index-card:hover .img-wrap img { transform: scale(1.04); }
.index-card .num {
  font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 4px;
}
.index-card h4 {
  font-family: var(--serif); font-weight: 400;
  font-size: 17px; letter-spacing: 0.02em;
  color: var(--ink);
  margin-bottom: 2px;
}
.index-card .meta {
  font-style: italic; color: var(--ink-dim);
  font-size: 12px;
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════
   C.BARNICKEL VIRTUAL GALLERY  —  full rebuild
   ═══════════════════════════════════════════════════════════════════ */

/* ─── 1. Constants ─── */
const LOBBY_W = 18, LOBBY_D = 12, LOBBY_H = 6.5;
const WALL_THICKNESS = 0.16;     // walls have real thickness — no z-fighting
const ARCH_WIDTH = 2.4;
const ARCH_HEIGHT = 2.8;
const PLAYER_BUFFER = 0.45;
const PLAYER_HEIGHT = 1.65;
const FOV = 65;
const HANG_HEIGHT = 1.55;
const WALK_SPEED = 3.2;
const TAP_WALK_SPEED = 5.5;
const PINCH_PX_PER_M = 110;
const STRAFE_PX_PER_M = 130;
const SNAP_TRIGGER_DIST = 2.4;
const SNAP_IDLE_TIME = 0.7;        // wait longer before snapping (less aggressive)
const SNAP_VIEW_ANGLE = Math.PI / 5;

/* ─── 2. Globals ─── */
let scene, camera, renderer, raycaster;
let canvas;
let lastTime = 0;

let ARTWORKS = [];
let SERIES = {};
const ROOMS = {};
let currentRoomId = 'lobby';

const paintingMeshes = [];
const wallMeshes = [];
const floorMeshes = [];
const ceilingMeshes = [];
let lobbyTitleMesh = null;
const seriesLabels = [];

let theme = 'dark';
let lightingMul = 1.0;

const lightingRefs = {
  ambient: null,
  hemi: null,
  spots: [],
  centerGlows: [],
  trackBars: [],
};

let yaw = 0, pitch = 0;

let navMode = 'tap-pinch';
let entered = false;
let hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const keys = { w: false, a: false, s: false, d: false };
let joyVec = { x: 0, y: 0 };

let tapWalkTarget = null;

let pinchActive = false;
let pinchPrevDist = 0;
let pinchPrevMidX = 0;

let touchLook = null;

let timeSinceInput = 0;
let snapTween = null;
let lastSnappedPainting = null;

const intro = {
  active: false,
  startTime: 0,
  duration: 5.2,
  // Multi-keyframe sweep — never points at a wall, ends framing all 3 doors
  keyframes: [
    { t: 0.00, pos: { x:  3.5, y: 4.2, z: 5.0 }, yaw: -0.40, pitch: -0.30 },
    { t: 0.40, pos: { x: -2.5, y: 3.4, z: 4.8 }, yaw:  0.20, pitch: -0.20 },
    { t: 0.75, pos: { x:  0.5, y: 2.2, z: 4.7 }, yaw: -0.05, pitch: -0.06 },
    { t: 1.00, pos: { x:  0.0, y: PLAYER_HEIGHT, z: 4.5 }, yaw: 0, pitch: 0 },
  ],
};
let introHasPlayed = false;

let hintHasShown = false;
let hintHideTimer = 0;

/* ─── 3. Theme ─── */
const THEMES = {
  dark: {
    bg: 0x0a0908,
    wall: 0x171311,
    wallStrong: 0x100c08,
    floor: 0x130f0a,
    ceiling: 0x06050a,
    ambient: { color: 0xfff6e0, intensity: 0.32 },
    hemi: { sky: 0xfff8e8, ground: 0x1a1410, intensity: 0.5 },
    spot: { color: 0xfff2d4, intensity: 1.5 },
    glow: { color: 0xc9a96e, intensity: 0.45 },
    trackBar: 0x1a1612,
    title: '#e6c885',
    titleAlpha: 0.92,
    label: '#e6c885',
    labelAlpha: 0.95,
    fog: { color: 0x07060a, density: 0.02 },
    rendererClear: 0x07060a,
  },
  white: {
    bg: 0xefe9dc,
    wall: 0xeae3d3,
    wallStrong: 0xd4cdbe,
    floor: 0x9d968a,
    ceiling: 0xece6db,
    ambient: { color: 0xffffff, intensity: 0.55 },
    hemi: { sky: 0xffffff, ground: 0x8a847a, intensity: 0.5 },
    spot: { color: 0xfffaef, intensity: 0.45 },
    glow: { color: 0xffffff, intensity: 0.0 },
    trackBar: 0x2a2624,
    title: '#3a3128',
    titleAlpha: 0.92,
    label: '#2a221a',
    labelAlpha: 0.85,
    fog: { color: 0xefe9dc, density: 0.0035 },
    rendererClear: 0xefe9dc,
  },
};
function T() { return THEMES[theme]; }

/* ─── 4. Painting data ─── */
function parseSize(s) {
  if (!s || typeof s !== 'string') return null;
  const m = s.match(/(\d+(?:\.\d+)?)\s*x\s*(\d+(?:\.\d+)?)\s*(in|cm)/i);
  if (!m) return null;
  const w = parseFloat(m[1]), h = parseFloat(m[2]);
  const factor = m[3].toLowerCase() === 'cm' ? 0.01 : 0.0254;
  return { wM: w * factor, hM: h * factor, raw: s };
}
function formatSize(sz) {
  if (!sz) return '';
  const wIn = (sz.wM / 0.0254).toFixed(0);
  const hIn = (sz.hM / 0.0254).toFixed(0);
  return wIn + ' × ' + hIn + ' in';
}

async function loadGalleryData() {
  const res = await fetch('paintings.json', { cache: 'no-cache' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (!Array.isArray(data.paintings)) throw new Error('paintings.json missing "paintings"');
  if (!data.series || typeof data.series !== 'object') {
    data.series = { all: { name: 'Gallery', subtitle: '' } };
  }
  for (const art of data.paintings) {
    art._size = parseSize(art.size) || { wM: 0.30, hM: 0.23 };
    if (!art.series || !data.series[art.series]) {
      art.series = Object.keys(data.series)[0];
    }
  }
  return data;
}

/* ─── 5. Scene init ─── */
function initScene() {
  canvas = document.getElementById('stage');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(T().rendererClear, 1);

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(T().fog.color, T().fog.density);

  camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 0.1, 80);
  camera.position.set(0, PLAYER_HEIGHT, 4.5);
  yaw = 0; pitch = 0;
  camera.rotation.order = 'YXZ';

  raycaster = new THREE.Raycaster();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

/* ─── 6. Room layout ─── */
// Layout: 3 series rooms tile north of the lobby, plus an "Older Work" room
// south of the lobby (behind spawn). Each room has ONE archway to the lobby.
// Lobby has up to 4 archways: 3 north, 1 south.
// Each entry: side specifies which lobby wall the arch sits on.
const SERIES_LAYOUT = [
  { sid: 'plein-air',             side: 'north', archX: -5, roomCx: -7, roomW: 8,  roomD: 14 },
  { sid: 'constructed-landscape', side: 'north', archX:  0, roomCx:  0, roomW: 6,  roomD: 14 },
  { sid: 'figurative',            side: 'north', archX: +5, roomCx:  7, roomW: 8,  roomD: 10 },
  { sid: 'older-work',            side: 'south', archX:  0, roomCx:  0, roomW: 12, roomD: 9  },
];

function buildGallery() {
  const t = T();

  // Lobby
  ROOMS.lobby = {
    id: 'lobby',
    name: 'Lobby',
    w: LOBBY_W, d: LOBBY_D, h: LOBBY_H,
    cx: 0, cz: 0,
    archways: [],
  };

  // Series rooms — north or south of lobby per def.side
  for (const def of SERIES_LAYOUT) {
    if (!SERIES[def.sid]) continue;
    let cz;
    if (def.side === 'north') {
      cz = -(LOBBY_D/2 + def.roomD/2);
    } else {
      // south side — older work, behind spawn
      cz = (LOBBY_D/2 + def.roomD/2);
    }
    ROOMS[def.sid] = {
      id: def.sid,
      name: SERIES[def.sid].name,
      subtitle: SERIES[def.sid].subtitle || '',
      side: def.side,
      w: def.roomW, d: def.roomD, h: LOBBY_H,
      cx: def.roomCx, cz: cz,
      archways: [{
        // For a north-side room, its arch is on its OWN south wall (to the lobby).
        // For a south-side room, its arch is on its OWN north wall.
        dir: def.side === 'north' ? 'south' : 'north',
        worldX: def.archX,
        connectsTo: 'lobby',
      }],
    };
    // Lobby gets a matching arch on the corresponding wall
    ROOMS.lobby.archways.push({
      dir: def.side,            // 'north' or 'south'
      worldX: def.archX,
      sid: def.sid,
    });
  }

  // Build floors and ceilings
  buildFloorsAndCeilings(t);

  // Build walls — adjacent rooms share walls (only one mesh per shared boundary)
  buildAllWalls(t);

  // Add the C.Barnickel banner above the central arch
  buildLobbyTitle();

  // Add room labels above each archway (lobby side)
  buildRoomLabels();

  // Track lighting bars (visual ceiling track)
  buildTrackLighting(t);

  // Lights
  lightingRefs.ambient = new THREE.AmbientLight(t.ambient.color, t.ambient.intensity);
  scene.add(lightingRefs.ambient);
  lightingRefs.hemi = new THREE.HemisphereLight(t.hemi.sky, t.hemi.ground, t.hemi.intensity);
  scene.add(lightingRefs.hemi);

  // Soft center glow per room
  lightingRefs.centerGlows = [];
  for (const id of Object.keys(ROOMS)) {
    const r = ROOMS[id];
    const g = new THREE.PointLight(t.glow.color, t.glow.intensity, Math.max(r.w, r.d), 2);
    g.position.set(r.cx, r.h - 0.4, r.cz);
    scene.add(g);
    lightingRefs.centerGlows.push(g);
  }
}

function buildFloorsAndCeilings(t) {
  const floorMat = new THREE.MeshStandardMaterial({
    color: t.floor,
    roughness: 0.78,
    metalness: 0.0,
  });
  const ceilMat = new THREE.MeshStandardMaterial({
    color: t.ceiling,
    roughness: 1.0,
  });
  for (const id of Object.keys(ROOMS)) {
    const r = ROOMS[id];
    // Floor
    const fGeo = new THREE.PlaneGeometry(r.w, r.d);
    const f = new THREE.Mesh(fGeo, floorMat);
    f.rotation.x = -Math.PI / 2;
    f.position.set(r.cx, 0, r.cz);
    f.userData.isFloor = true;
    f.userData.roomId = id;
    scene.add(f);
    floorMeshes.push(f);
    // Ceiling
    const cGeo = new THREE.PlaneGeometry(r.w, r.d);
    const c = new THREE.Mesh(cGeo, ceilMat);
    c.rotation.x = Math.PI / 2;
    c.position.set(r.cx, r.h, r.cz);
    scene.add(c);
    ceilingMeshes.push(c);
  }
}

/* Build all walls. Each unique wall plane (in world coords) is built ONCE,
   even if it borders two rooms. Walls are 3D boxes (have thickness, no z-fight). */
function buildAllWalls(t) {
  const wallMat = new THREE.MeshStandardMaterial({
    color: t.wall,
    roughness: 0.92,
    metalness: 0.0,
  });

  // Compute all unique wall segments. Each wall is described by:
  //   - axis: 'x' (vertical wall, runs along z) or 'z' (horizontal, runs along x)
  //   - at: world coordinate along its perpendicular axis
  //   - from, to: extent along its parallel axis
  //   - height: y range (always 0 to LOBBY_H)
  //   - archways: list of {center, width} cuts in this wall
  // We collect from rooms, dedupe shared walls, then build.

  // Each room contributes 4 walls (N, S, E, W). For shared walls, two rooms
  // contribute the same wall — we merge them.
  const walls = [];
  // Helper to add a wall, merging with existing if already present
  function addWall(axis, at, from, to, archways) {
    // Look for existing wall on same axis+at with overlapping range
    for (const w of walls) {
      if (w.axis === axis && Math.abs(w.at - at) < 0.001) {
        // Same plane — merge ranges
        w.from = Math.min(w.from, from);
        w.to = Math.max(w.to, to);
        if (archways) {
          for (const a of archways) {
            // Skip duplicates (same center +- small tolerance, same width)
            const dup = w.archways.some(ex =>
              Math.abs(ex.center - a.center) < 0.05 && Math.abs(ex.width - a.width) < 0.05);
            if (!dup) w.archways.push(a);
          }
        }
        return;
      }
    }
    walls.push({ axis, at, from, to, archways: archways ? archways.slice() : [] });
  }

  for (const id of Object.keys(ROOMS)) {
    const r = ROOMS[id];
    const xMin = r.cx - r.w/2, xMax = r.cx + r.w/2;
    const zMin = r.cz - r.d/2, zMax = r.cz + r.d/2;

    // North wall (z = zMin), runs along x, normal pointing +z
    const nArches = r.archways.filter(a => a.dir === 'north')
      .map(a => ({ center: a.worldX, width: ARCH_WIDTH }));
    addWall('z', zMin, xMin, xMax, nArches);

    // South wall (z = zMax)
    const sArches = r.archways.filter(a => a.dir === 'south')
      .map(a => ({ center: a.worldX, width: ARCH_WIDTH }));
    addWall('z', zMax, xMin, xMax, sArches);

    // West wall (x = xMin), runs along z
    const wArches = r.archways.filter(a => a.dir === 'west')
      .map(a => ({ center: a.worldZ, width: ARCH_WIDTH }));
    addWall('x', xMin, zMin, zMax, wArches);

    // East wall (x = xMax)
    const eArches = r.archways.filter(a => a.dir === 'east')
      .map(a => ({ center: a.worldZ, width: ARCH_WIDTH }));
    addWall('x', xMax, zMin, zMax, eArches);
  }

  // Build geometry for each unique wall
  for (const w of walls) {
    buildWallSegments(w, wallMat);
  }
}

// For a wall with possibly multiple archway cuts, build the wall as a series
// of box-shaped segments around the cuts (left, right, top lintels, etc.)
function buildWallSegments(wall, mat) {
  const { axis, at, from, to, archways } = wall;
  const length = to - from;
  if (length < 0.01) return;

  // Sort archways by center; clip ranges to wall extent
  const cuts = archways
    .filter(a => a.center >= from + 0.1 && a.center <= to - 0.1)
    .map(a => ({
      from: Math.max(from, a.center - a.width / 2),
      to:   Math.min(to,   a.center + a.width / 2),
    }))
    .sort((x, y) => x.from - y.from);

  // Build solid wall segments (between cuts)
  let cursor = from;
  for (const cut of cuts) {
    if (cut.from > cursor + 0.01) {
      // Solid segment from cursor to cut.from
      addWallBox(axis, at, cursor, cut.from, 0, LOBBY_H, mat);
    }
    // Lintel above the cut (from cut.from to cut.to, from ARCH_HEIGHT to LOBBY_H)
    addWallBox(axis, at, cut.from, cut.to, ARCH_HEIGHT, LOBBY_H, mat);
    cursor = cut.to;
  }
  if (cursor < to - 0.01) {
    addWallBox(axis, at, cursor, to, 0, LOBBY_H, mat);
  }
}

// Add a single box-shaped wall segment. axis='z' = wall runs along x (horizontal),
// axis='x' = wall runs along z (vertical from above).
function addWallBox(axis, at, alongFrom, alongTo, yFrom, yTo, mat) {
  const alongLength = alongTo - alongFrom;
  if (alongLength < 0.005) return;
  const yLength = yTo - yFrom;
  if (yLength < 0.005) return;

  let geo, pos;
  if (axis === 'z') {
    // Wall runs along x; box dims: alongLength × yLength × WALL_THICKNESS
    geo = new THREE.BoxGeometry(alongLength, yLength, WALL_THICKNESS);
    pos = [(alongFrom + alongTo) / 2, (yFrom + yTo) / 2, at];
  } else {
    geo = new THREE.BoxGeometry(WALL_THICKNESS, yLength, alongLength);
    pos = [at, (yFrom + yTo) / 2, (alongFrom + alongTo) / 2];
  }
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...pos);
  m.userData.isWall = true;
  m.userData.axis = axis;
  m.userData.at = at;
  scene.add(m);
  wallMeshes.push(m);
}

/* ─── Lobby title (C.Barnickel banner) ─── */
function buildLobbyTitle() {
  const lobby = ROOMS.lobby;
  const tex = makeLobbyTitleTexture();
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: T().titleAlpha });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(6.5, 1.6), mat);
  // Above the central archway, on the lobby-facing side of the north wall
  const z = lobby.cz - lobby.d/2 + WALL_THICKNESS/2 + 0.01;
  // Vertical: between arch top (2.8) and ceiling (6.5), centered around 4.6
  mesh.position.set(0, 4.6, z);
  scene.add(mesh);
  lobbyTitleMesh = mesh;
}

function makeLobbyTitleTexture() {
  const c = document.createElement('canvas');
  c.width = 2048; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 4;
  ctx.fillStyle = T().title;
  ctx.font = '300 200px "Cormorant Garamond", Georgia, serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('C.BARNICKEL', c.width / 2, c.height / 2 - 50);
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
  ctx.fillStyle = T().title;
  ctx.globalAlpha = 0.7;
  ctx.font = 'italic 64px "Cormorant Garamond", Georgia, serif';
  ctx.fillText('Artwork', c.width / 2, c.height / 2 + 110);
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  tex.anisotropy = 4;
  return tex;
}

/* ─── Room labels above archways ─── */
function buildRoomLabels() {
  const lobby = ROOMS.lobby;
  for (const arch of lobby.archways) {
    const target = ROOMS[arch.sid];
    if (!target) continue;
    const tex = makeLabelTexture(target.name, target.subtitle);
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: T().labelAlpha });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 0.65), mat);
    // Position above the arch on the lobby-side of the appropriate wall.
    // For a north arch, the label is on lobby's north wall (z = -d/2),
    // facing INTO the lobby (toward +z). For a south arch, label is on
    // lobby's south wall (z = +d/2), facing INTO the lobby (toward -z).
    if (arch.dir === 'north') {
      const z = lobby.cz - lobby.d/2 + WALL_THICKNESS/2 + 0.012;
      mesh.position.set(arch.worldX, ARCH_HEIGHT + 0.55, z);
      // Plane default normal is +z — that points into the lobby. ✓
    } else {
      const z = lobby.cz + lobby.d/2 - WALL_THICKNESS/2 - 0.012;
      mesh.position.set(arch.worldX, ARCH_HEIGHT + 0.55, z);
      mesh.rotation.y = Math.PI;   // flip to face -z (into lobby)
    }
    scene.add(mesh);
    seriesLabels.push({ mesh, name: target.name, subtitle: target.subtitle, sid: arch.sid });
  }
}

function makeLabelTexture(label, subtitle) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  // Centered, with shadow for legibility
  ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 2;
  ctx.fillStyle = T().label;
  // Auto-fit font size so even long labels (CONSTRUCTED LANDSCAPE) fit
  let fontSize = 78;
  ctx.font = '500 ' + fontSize + 'px "Cormorant Garamond", Georgia, serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // Measure & shrink if too wide
  const maxWidth = c.width * 0.92;
  let metrics = ctx.measureText(label.toUpperCase());
  while (metrics.width > maxWidth && fontSize > 38) {
    fontSize -= 4;
    ctx.font = '500 ' + fontSize + 'px "Cormorant Garamond", Georgia, serif';
    metrics = ctx.measureText(label.toUpperCase());
  }
  const yMain = subtitle ? c.height / 2 - 30 : c.height / 2;
  ctx.fillText(label.toUpperCase(), c.width / 2, yMain);
  if (subtitle) {
    ctx.shadowBlur = 5;
    ctx.font = 'italic 32px "Cormorant Garamond", Georgia, serif';
    ctx.globalAlpha = 0.78;
    ctx.fillText(subtitle, c.width / 2, c.height / 2 + 50);
    ctx.globalAlpha = 1;
  }
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  tex.anisotropy = 4;
  return tex;
}

/* ─── Track lighting bars (visual only, ceiling) ─── */
function buildTrackLighting(t) {
  const trackMat = new THREE.MeshBasicMaterial({ color: t.trackBar });
  for (const id of Object.keys(ROOMS)) {
    const r = ROOMS[id];
    // Two parallel bars across the room
    for (const offsetZ of [-r.d/4, r.d/4]) {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(r.w * 0.8, 0.04, 0.06), trackMat);
      bar.position.set(r.cx, r.h - 0.05, r.cz + offsetZ);
      scene.add(bar);
      lightingRefs.trackBars.push(bar);
    }
  }
}
/* ─── 7. Painting placement ─── */

function placeAllPaintings() {
  // For each series, distribute paintings across the room's available walls.
  // Skip the south wall (which has the archway). Prefer the back (north) wall.
  for (const sid of Object.keys(SERIES)) {
    const room = ROOMS[sid];
    if (!room) continue;
    const subset = ARTWORKS.filter(a => a.series === sid);
    if (subset.length === 0) continue;
    placeSeriesInRoom(room, subset, sid);
  }
}

// Place subset of paintings into room, distributing across non-arch walls.
function placeSeriesInRoom(room, paintings, sid) {
  // Determine which wall direction has the arch — that wall is unavailable.
  // Use the room's own archways list (which has dir set per the room's frame).
  const archDirs = new Set((room.archways || []).map(a => a.dir));
  // Build the list of available walls, skipping any that contain an arch
  const ALL = [
    { dir: 'north', len: room.w },
    { dir: 'south', len: room.w },
    { dir: 'east',  len: room.d },
    { dir: 'west',  len: room.d },
  ];
  const avail = ALL.filter(w => !archDirs.has(w.dir)).map(w => ({ ...w, capacity: 0, list: [] }));
  // Sort paintings by area, biggest first
  const sorted = [...paintings].sort((a, b) =>
    (b._size.wM * b._size.hM) - (a._size.wM * a._size.hM));

  // Greedy fill: place each painting on the wall with most remaining space
  for (const art of sorted) {
    const slot = art._size.wM + 0.7;
    const wall = avail.reduce((best, w) =>
      (w.len - w.capacity > best.len - best.capacity) ? w : best, avail[0]);
    if (!wall) break;
    if (wall.capacity + slot > wall.len - 0.4) {
      const alt = avail
        .filter(w => w.len - w.capacity > slot + 0.4)
        .sort((a, b) => (b.len - b.capacity) - (a.len - a.capacity))[0];
      if (alt) { alt.list.push(art); alt.capacity += slot; }
      else { wall.list.push(art); wall.capacity += slot; }   // overflow
    } else {
      wall.list.push(art); wall.capacity += slot;
    }
  }

  for (const w of avail) {
    if (w.list.length === 0) continue;
    placeOnWall(room, w.dir, w.list);
  }
}

function placeOnWall(room, dir, list) {
  const len = (dir === 'north' || dir === 'south') ? room.w : room.d;
  // Total used length
  let totalW = 0;
  for (const art of list) totalW += art._size.wM;
  const gap = (len - totalW) / (list.length + 1);

  let cursor = -len / 2 + gap;
  for (let i = 0; i < list.length; i++) {
    const art = list[i];
    const localCoord = cursor + art._size.wM / 2;
    cursor += art._size.wM + gap;
    placePainting(art, dir, localCoord, room);
  }
}

// Place a single painting on a specific wall of a room at a given lateral offset.
function placePainting(art, dir, localCoord, room) {
  const xMin = room.cx - room.w/2, xMax = room.cx + room.w/2;
  const zMin = room.cz - room.d/2, zMax = room.cz + room.d/2;
  // Wall position in world coords + outward normal
  let wallX, wallZ, normalX, normalZ, faceY;
  // localCoord is the position along the wall (in the wall's parallel axis)
  if (dir === 'north') {
    wallX = room.cx + localCoord;
    wallZ = zMin;
    normalX = 0; normalZ = 1;       // normal pointing into the room (+z)
    faceY = 0;
  } else if (dir === 'south') {
    wallX = room.cx + localCoord;
    wallZ = zMax;
    normalX = 0; normalZ = -1;
    faceY = Math.PI;
  } else if (dir === 'east') {
    wallX = xMax;
    wallZ = room.cz + localCoord;
    normalX = -1; normalZ = 0;
    faceY = -Math.PI / 2;
  } else if (dir === 'west') {
    wallX = xMin;
    wallZ = room.cz + localCoord;
    normalX = 1; normalZ = 0;
    faceY = Math.PI / 2;
  }
  // Position the painting's front face slightly off the wall
  const offset = WALL_THICKNESS / 2 + 0.012;
  const px = wallX + normalX * offset;
  const pz = wallZ + normalZ * offset;

  const pW = art._size.wM, pH = art._size.hM;
  let yCenter = HANG_HEIGHT;
  // Adjust for very tall paintings
  if (yCenter + pH/2 > LOBBY_H - 0.5) yCenter = LOBBY_H - 0.5 - pH/2;
  if (yCenter - pH/2 < 0.4) yCenter = 0.4 + pH/2;

  // Frame (slightly bigger black plane behind)
  const frameThk = Math.max(0.05, Math.min(0.10, pH * 0.06));
  const frameMat = new THREE.MeshStandardMaterial({
    color: theme === 'dark' ? 0x0d0a08 : 0x1a1612,
    roughness: 0.7,
    metalness: 0.05,
  });
  const frame = new THREE.Mesh(
    new THREE.PlaneGeometry(pW + frameThk * 2, pH + frameThk * 2),
    frameMat
  );
  frame.position.set(px, yCenter, pz);
  frame.rotation.y = faceY;
  scene.add(frame);

  // Painting (texture loaded async)
  new THREE.TextureLoader().load(
    'paintings/' + art.file,
    (tex) => {
      tex.encoding = THREE.sRGBEncoding;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const pMat = new THREE.MeshStandardMaterial({
        map: tex,
        roughness: 0.62,
      });
      const p = new THREE.Mesh(new THREE.PlaneGeometry(pW, pH), pMat);
      p.position.set(px + normalX * 0.005, yCenter, pz + normalZ * 0.005);
      p.rotation.y = faceY;
      p.userData.isPainting = true;
      p.userData.artIndex = ARTWORKS.indexOf(art);
      p.userData.outwardNormal = { x: normalX, z: normalZ };
      p.userData.roomId = room.id;
      scene.add(p);
      paintingMeshes.push(p);
    },
    undefined,
    (err) => console.warn('Failed to load', art.file, err)
  );

  // Spotlight per painting
  const spotDist = Math.max(1.5, Math.min(2.8, room.h - HANG_HEIGHT));
  const spot = new THREE.SpotLight(
    T().spot.color,
    T().spot.intensity * lightingMul,
    8,
    Math.PI / 6,
    0.4,
    1.2
  );
  spot.position.set(
    px + normalX * Math.min(2.0, room.w / 4),
    LOBBY_H - 0.25,
    pz + normalZ * Math.min(2.0, room.d / 4),
  );
  spot.target.position.set(px, yCenter, pz);
  scene.add(spot);
  scene.add(spot.target);
  lightingRefs.spots.push(spot);
}

/* ─── 8. Navigation: tap, pinch, joystick, magnetic snap ─── */

function setNavMode(mode) {
  if (!['tap-pinch', 'tap-art', 'tap-any', 'classic'].includes(mode)) mode = 'tap-pinch';
  navMode = mode;
  // Joystick visibility — only in classic mode (and only on touch devices)
  const joy = document.getElementById('joy');
  joy.classList.toggle('show', mode === 'classic' && hasTouch && entered);
  // Cancel any active tap-walk or pinch when switching modes
  tapWalkTarget = null;
  pinchActive = false;
  // Update active button styling
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.nav === mode);
  });
  // Show a brief hint after switching
  showHintForCurrentMode(2500);
}

// Get the appropriate "first interaction" hint for the current nav mode
function getNavHint() {
  if (navMode === 'tap-pinch') return hasTouch ? 'pinch out to walk forward' : 'scroll wheel to walk · drag to look';
  if (navMode === 'tap-art')   return 'tap a painting to approach it';
  if (navMode === 'tap-any')   return 'tap anywhere to walk';
  return hasTouch ? 'drag joystick to walk · drag screen to look' : 'wasd or arrows to walk · drag to look';
}

function showHintForCurrentMode(durationMs) {
  const hint = document.getElementById('bottom-hint');
  hint.textContent = getNavHint();
  hint.classList.add('show');
  clearTimeout(hintHideTimer);
  hintHideTimer = setTimeout(() => hint.classList.remove('show'), durationMs || 4000);
}

function hideHint() {
  const hint = document.getElementById('bottom-hint');
  hint.classList.remove('show');
}

/* ─── Pointer & touch handling ─── */
function attachInputHandlers() {
  // Mouse
  canvas.addEventListener('mousedown', onMouseDown);
  canvas.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('mouseup', onMouseUp);
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // Wheel — walks forward/back in tap-pinch mode, otherwise nothing
  canvas.addEventListener('wheel', onWheel, { passive: false });

  // Touch
  canvas.addEventListener('touchstart', onTouchStart, { passive: false });
  canvas.addEventListener('touchmove', onTouchMove, { passive: false });
  canvas.addEventListener('touchend', onTouchEnd, { passive: false });
  canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });

  // Keyboard
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);

  // Joystick
  setupJoystick();
}

let mouseLook = null;
function onMouseDown(e) {
  if (intro.active) return;
  if (e.button !== 0) return;
  mouseLook = { x: e.clientX, y: e.clientY, yaw, pitch, moved: 0 };
  noteUserInput();
}
function onMouseMove(e) {
  if (!mouseLook) return;
  const dx = e.clientX - mouseLook.x;
  const dy = e.clientY - mouseLook.y;
  mouseLook.moved += Math.abs(dx) + Math.abs(dy);
  yaw = mouseLook.yaw - dx * 0.0034;
  pitch = mouseLook.pitch - dy * 0.0034;
  pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch));
}
function onMouseUp(e) {
  // Always stop lighter burn on release, regardless of whether tap fires
  if (lighterHeld) stopLighterBurn();
  if (!mouseLook) return;
  if (mouseLook.moved < 6) handleTap(e.clientX, e.clientY);
  mouseLook = null;
}

function onWheel(e) {
  if (intro.active) return;
  if (navMode !== 'tap-pinch') return;
  e.preventDefault();
  const stepM = -e.deltaY * 0.005;
  walkAlongView(stepM, 0);
  noteUserInput();
}

function onTouchStart(e) {
  if (intro.active) return;
  e.preventDefault();
  if (navMode === 'tap-pinch' && e.touches.length >= 2) {
    const t0 = e.touches[0], t1 = e.touches[1];
    pinchActive = true;
    pinchPrevDist = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
    pinchPrevMidX = (t0.clientX + t1.clientX) / 2;
    touchLook = null;
    tapWalkTarget = null;
    noteUserInput();
    return;
  }
  for (const t of e.changedTouches) {
    if (touchLook === null) {
      touchLook = { id: t.identifier, x: t.clientX, y: t.clientY, yaw, pitch, moved: 0 };
    }
  }
  noteUserInput();
}
function onTouchMove(e) {
  if (intro.active) return;
  if (pinchActive && e.touches.length >= 2) {
    const t0 = e.touches[0], t1 = e.touches[1];
    const d = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
    const midX = (t0.clientX + t1.clientX) / 2;
    const forward = (d - pinchPrevDist) / PINCH_PX_PER_M;
    const strafe  = -(midX - pinchPrevMidX) / STRAFE_PX_PER_M;
    if (Math.abs(forward) > 0.0005 || Math.abs(strafe) > 0.0005) {
      walkAlongView(forward, strafe);
    }
    pinchPrevDist = d;
    pinchPrevMidX = midX;
    noteUserInput();
    return;
  }
  for (const t of e.touches) {
    if (touchLook && t.identifier === touchLook.id) {
      const dx = t.clientX - touchLook.x;
      const dy = t.clientY - touchLook.y;
      touchLook.moved += Math.abs(dx) + Math.abs(dy);
      yaw = touchLook.yaw - dx * 0.0034;
      pitch = touchLook.pitch - dy * 0.0034;
      pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch));
      noteUserInput();
    }
  }
}
function onTouchEnd(e) {
  // Always stop lighter burn on release
  if (lighterHeld && e.touches.length === 0) stopLighterBurn();
  if (pinchActive) {
    if (e.touches.length < 2) {
      pinchActive = false;
      touchLook = null;
    } else {
      const t0 = e.touches[0], t1 = e.touches[1];
      pinchPrevDist = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
      pinchPrevMidX = (t0.clientX + t1.clientX) / 2;
    }
  }
  for (const t of e.changedTouches) {
    if (touchLook && t.identifier === touchLook.id) {
      if (touchLook.moved < 10) handleTap(t.clientX, t.clientY);
      touchLook = null;
    }
  }
}

function onKeyDown(e) {
  if (intro.active) return;
  const k = e.key.toLowerCase();
  if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
  if (k === 's' || e.key === 'ArrowDown') keys.s = true;
  if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
  if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
  if (k === 'escape') {
    closeAllOverlays();
  }
  if (keys.w || keys.a || keys.s || keys.d) noteUserInput();
}
function onKeyUp(e) {
  const k = e.key.toLowerCase();
  if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
  if (k === 's' || e.key === 'ArrowDown') keys.s = false;
  if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
  if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
}

/* Joystick */
function setupJoystick() {
  const joy = document.getElementById('joy');
  const stick = document.getElementById('joy-stick');
  let activeId = null;
  let cx = 0, cy = 0;
  const maxR = 32;

  const start = (x, y, id) => {
    activeId = id;
    const r = joy.getBoundingClientRect();
    cx = r.left + r.width / 2;
    cy = r.top + r.height / 2;
    update(x - cx, y - cy);
    noteUserInput();
  };
  const update = (dx, dy) => {
    const len = Math.hypot(dx, dy);
    let nx = dx, ny = dy;
    if (len > maxR) { nx = dx * maxR / len; ny = dy * maxR / len; }
    stick.style.transform = `translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
    joyVec.x = nx / maxR;
    joyVec.y = ny / maxR;
  };
  const end = () => {
    activeId = null;
    stick.style.transform = 'translate(-50%, -50%)';
    joyVec.x = 0; joyVec.y = 0;
  };

  joy.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    start(t.clientX, t.clientY, t.identifier);
  }, { passive: false });
  joy.addEventListener('touchmove', (e) => {
    if (activeId === null) return;
    for (const t of e.touches) {
      if (t.identifier === activeId) update(t.clientX - cx, t.clientY - cy);
    }
  }, { passive: false });
  joy.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) if (t.identifier === activeId) end();
  });
}

/* Tap routing — based on nav mode */
function handleTap(clientX, clientY) {
  if (window._destruction && window._destruction.active) {
    if (window._destruction.fire) window._destruction.fire();
    return;
  }
  const nx = (clientX / window.innerWidth) * 2 - 1;
  const ny = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera({ x: nx, y: ny }, camera);

  const paintingHits = raycaster.intersectObjects(paintingMeshes, false);

  if (navMode === 'classic') {
    // Tap painting -> open modal
    if (paintingHits.length > 0) openModal(paintingHits[0].object.userData.artIndex);
    return;
  }

  if (paintingHits.length > 0) {
    const p = paintingHits[0].object;
    const dist = Math.hypot(p.position.x - camera.position.x, p.position.z - camera.position.z);
    if (dist < 1.8) {
      // Already close — open modal
      openModal(p.userData.artIndex);
      return;
    }
    const view = computeViewingPosition(p);
    if (view) tapWalkTarget = view;
    return;
  }

  // No painting hit
  if (navMode === 'tap-any' || navMode === 'tap-pinch') {
    const floorHits = raycaster.intersectObjects(floorMeshes, false);
    if (floorHits.length > 0) {
      const pt = floorHits[0].point;
      const c = clampToRooms(pt.x, pt.z);
      tapWalkTarget = { x: c.x, z: c.z };
    }
  }
  // tap-art mode: tapping floor does nothing
}

function computeViewingPosition(painting) {
  const p = painting.position;
  const n = painting.userData.outwardNormal;
  if (!n) return null;
  // Distance scaled to painting size — bigger paintings, stand back further
  const geom = painting.geometry;
  if (!geom.boundingBox) geom.computeBoundingBox();
  const bb = geom.boundingBox;
  const pW = bb.max.x - bb.min.x, pH = bb.max.y - bb.min.y;
  const back = Math.max(1.6, Math.min(Math.max(pW, pH) * 1.7, 3.6));
  return {
    x: p.x + n.x * back,
    z: p.z + n.z * back,
    faceX: p.x,
    faceZ: p.z,
  };
}

/* Move along view direction. forward/strafe in meters. */
function walkAlongView(forward, strafe) {
  // Horizontal forward = projection of look direction onto floor plane
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  // Right = perpendicular (rotate forward 90° clockwise around Y up)
  const rx = -fz, rz = fx;
  const newX = camera.position.x + fx * forward + rx * strafe;
  const newZ = camera.position.z + fz * forward + rz * strafe;
  const c = clampToRooms(newX, newZ);
  camera.position.x = c.x;
  camera.position.z = c.z;
  currentRoomId = c.roomId;
}

/* Note that the user just provided input — cancels magnetic snap, resets idle timer */
function noteUserInput() {
  timeSinceInput = 0;
  if (snapTween) {
    snapTween = null;   // cancel in-progress snap
  }
}

/* ─── Room/painting collision: clamp position to within rooms, blocking walls ─── */
function clampToRooms(x, z) {
  const buf = PLAYER_BUFFER;
  // Find which room (or arch lane) the target point is in
  let inRoom = null;
  for (const id of Object.keys(ROOMS)) {
    const r = ROOMS[id];
    if (x >= r.cx - r.w/2 - 0.05 && x <= r.cx + r.w/2 + 0.05 &&
        z >= r.cz - r.d/2 - 0.05 && z <= r.cz + r.d/2 + 0.05) {
      inRoom = r; break;
    }
  }
  if (!inRoom) inRoom = ROOMS[currentRoomId] || ROOMS.lobby;

  // Build a "passable through arch" check for each wall
  const inArchOpening = (dir) => {
    for (const a of inRoom.archways) {
      if (a.dir !== dir) continue;
      const archX = a.worldX !== undefined ? a.worldX : inRoom.cx;
      if (Math.abs(x - archX) <= ARCH_WIDTH/2 - 0.1) return true;
    }
    return false;
  };

  const xMin = inRoom.cx - inRoom.w/2 + buf;
  const xMax = inRoom.cx + inRoom.w/2 - buf;
  const zMin = inRoom.cz - inRoom.d/2 + buf;
  const zMax = inRoom.cz + inRoom.d/2 - buf;

  // North/south clamping: allow through arch
  if (z < zMin && !inArchOpening('north')) z = zMin;
  if (z > zMax && !inArchOpening('south')) z = zMax;
  // East/west clamping (paintings rooms don't currently have E/W arches but support it)
  if (x < xMin) x = xMin;
  if (x > xMax) x = xMax;

  // Painting collision — keep at least 0.45m from any painting plane
  for (const p of paintingMeshes) {
    if (p.userData.roomId !== inRoom.id) continue;
    const n = p.userData.outwardNormal;
    if (!n) continue;
    const dx = x - p.position.x, dz = z - p.position.z;
    const distAlongNormal = dx * n.x + dz * n.z;
    if (distAlongNormal > 0 && distAlongNormal < 0.45) {
      // Lateral position
      const tx = -n.z, tz = n.x;
      const lateral = dx * tx + dz * tz;
      const halfW = (p.geometry.boundingBox ? (p.geometry.boundingBox.max.x - p.geometry.boundingBox.min.x) / 2 : 0.5);
      if (Math.abs(lateral) < halfW + 0.25) {
        const push = 0.45 - distAlongNormal;
        x += n.x * push;
        z += n.z * push;
      }
    }
  }

  return { x, z, roomId: inRoom.id };
}

/* ─── Magnetic painting snap ─── */
function findSnapCandidate() {
  // Find painting nearest in the camera's forward cone, within trigger distance
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  let best = null, bestScore = Infinity;
  for (const p of paintingMeshes) {
    if (p === lastSnappedPainting) continue;
    const dx = p.position.x - camera.position.x;
    const dz = p.position.z - camera.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist > SNAP_TRIGGER_DIST || dist < 0.6) continue;
    // Check angle vs view direction
    const dnx = dx / dist, dnz = dz / dist;
    const dot = fx * dnx + fz * dnz;
    if (dot < Math.cos(SNAP_VIEW_ANGLE)) continue;
    // Painting must be facing roughly toward us
    const n = p.userData.outwardNormal;
    if (!n) continue;
    const facingDot = -dnx * n.x + -dnz * n.z;   // (-our direction) ⋅ painting normal
    if (facingDot < 0.5) continue;
    // Score: prefer closer + more aligned
    const score = dist - dot * 0.8;
    if (score < bestScore) {
      bestScore = score;
      best = p;
    }
  }
  return best;
}

function startSnapTo(painting) {
  const view = computeViewingPosition(painting);
  if (!view) return;
  // Determine target yaw to face the painting
  const dx = view.faceX - view.x;
  const dz = view.faceZ - view.z;
  const targetYaw = Math.atan2(-dx, -dz);
  // Take shortest angular path
  let dyaw = targetYaw - yaw;
  while (dyaw > Math.PI) dyaw -= 2 * Math.PI;
  while (dyaw < -Math.PI) dyaw += 2 * Math.PI;
  snapTween = {
    startPos: { x: camera.position.x, y: camera.position.y, z: camera.position.z },
    endPos: { x: view.x, y: PLAYER_HEIGHT, z: view.z },
    startYaw: yaw,
    endYaw: yaw + dyaw,
    startPitch: pitch,
    endPitch: 0,
    startTime: performance.now(),
    duration: 800,
    painting,
  };
  lastSnappedPainting = painting;
}

function updateSnap(now) {
  if (!snapTween) return;
  const elapsed = now - snapTween.startTime;
  let t = Math.min(1, elapsed / snapTween.duration);
  // Ease out cubic
  const eased = 1 - Math.pow(1 - t, 3);
  camera.position.x = snapTween.startPos.x + (snapTween.endPos.x - snapTween.startPos.x) * eased;
  camera.position.y = snapTween.startPos.y + (snapTween.endPos.y - snapTween.startPos.y) * eased;
  camera.position.z = snapTween.startPos.z + (snapTween.endPos.z - snapTween.startPos.z) * eased;
  yaw = snapTween.startYaw + (snapTween.endYaw - snapTween.startYaw) * eased;
  pitch = snapTween.startPitch + (snapTween.endPitch - snapTween.startPitch) * eased;
  if (t >= 1) {
    snapTween = null;
  }
}

/* ─── Tap-walk update (smooth move toward target) ─── */
function updateTapWalk(dt) {
  if (!tapWalkTarget) return;
  const tgt = tapWalkTarget;
  const dx = tgt.x - camera.position.x;
  const dz = tgt.z - camera.position.z;
  const dist = Math.hypot(dx, dz);
  if (dist >= 0.05) {
    const step = Math.min(dist, TAP_WALK_SPEED * dt);
    const c = clampToRooms(
      camera.position.x + (dx / dist) * step,
      camera.position.z + (dz / dist) * step
    );
    camera.position.x = c.x;
    camera.position.z = c.z;
    currentRoomId = c.roomId;
    return;
  }
  // Arrived — face target if specified
  if (typeof tgt.faceX === 'number') {
    const fdx = tgt.faceX - camera.position.x;
    const fdz = tgt.faceZ - camera.position.z;
    const targetYaw = Math.atan2(-fdx, -fdz);
    let dyaw = targetYaw - yaw;
    while (dyaw > Math.PI) dyaw -= 2 * Math.PI;
    while (dyaw < -Math.PI) dyaw += 2 * Math.PI;
    if (Math.abs(dyaw) < 0.02) {
      yaw = targetYaw;
      tapWalkTarget = null;
    } else {
      yaw += dyaw * Math.min(1, dt * 9);
      pitch = pitch * (1 - Math.min(1, dt * 4));
    }
  } else {
    tapWalkTarget = null;
  }
}
/* ─── 9. Cinematic intro ─── */
function startIntro() {
  intro.active = true;
  intro.startTime = performance.now();
  // Hide UI during intro
  hideHint();
  document.getElementById('joy').classList.remove('show');
  document.getElementById('skip-intro').classList.add('show');
}

function endIntro() {
  if (!intro.active) return;
  intro.active = false;
  introHasPlayed = true;
  document.getElementById('skip-intro').classList.remove('show');
  // Snap to last keyframe
  const last = intro.keyframes[intro.keyframes.length - 1];
  camera.position.set(last.pos.x, last.pos.y, last.pos.z);
  yaw = last.yaw;
  pitch = last.pitch;
  // Show nav hint for first-time guidance
  if (!hintHasShown) {
    showHintForCurrentMode(5000);
    hintHasShown = true;
  }
  // Restore joystick if classic mode on touch
  if (navMode === 'classic' && hasTouch) {
    document.getElementById('joy').classList.add('show');
  }
}

function updateIntro(now) {
  const elapsed = (now - intro.startTime) / 1000;
  let t = Math.min(1, elapsed / intro.duration);
  // Find which segment we're in
  const kfs = intro.keyframes;
  let i = 0;
  while (i < kfs.length - 1 && t > kfs[i + 1].t) i++;
  const a = kfs[i], b = kfs[Math.min(i + 1, kfs.length - 1)];
  const segT = (b.t - a.t > 0) ? (t - a.t) / (b.t - a.t) : 1;
  // Smooth ease (cubic) within each segment
  const eased = segT < 0.5 ? 4 * segT * segT * segT : 1 - Math.pow(-2 * segT + 2, 3) / 2;
  camera.position.x = a.pos.x + (b.pos.x - a.pos.x) * eased;
  camera.position.y = a.pos.y + (b.pos.y - a.pos.y) * eased;
  camera.position.z = a.pos.z + (b.pos.z - a.pos.z) * eased;
  yaw = a.yaw + (b.yaw - a.yaw) * eased;
  pitch = a.pitch + (b.pitch - a.pitch) * eased;
  if (t >= 1) endIntro();
}

function setTheme(newTheme) {

function applyTheme() {
  const t = T();
  // Renderer background + fog
  renderer.setClearColor(t.rendererClear, 1);
  scene.fog.color.setHex(t.fog.color);
  scene.fog.density = t.fog.density;

  // Walls
  for (const w of wallMeshes) {
    w.material.color.setHex(t.wall);
  }
  // Floors
  for (const f of floorMeshes) {
    f.material.color.setHex(t.floor);
  }
  // Ceilings
  for (const c of ceilingMeshes) {
    c.material.color.setHex(t.ceiling);
  }
  // Track bars
  for (const b of lightingRefs.trackBars) {
    b.material.color.setHex(t.trackBar);
  }
  // Lights
  if (lightingRefs.ambient) {
    lightingRefs.ambient.color.setHex(t.ambient.color);
    lightingRefs.ambient.intensity = t.ambient.intensity * lightingMul;
  }
  if (lightingRefs.hemi) {
    lightingRefs.hemi.color.setHex(t.hemi.sky);
    lightingRefs.hemi.groundColor.setHex(t.hemi.ground);
    lightingRefs.hemi.intensity = t.hemi.intensity * lightingMul;
  }
  for (const g of lightingRefs.centerGlows) {
    g.color.setHex(t.glow.color);
    g.intensity = t.glow.intensity * lightingMul;
  }
  for (const s of lightingRefs.spots) {
    s.color.setHex(t.spot.color);
    s.intensity = t.spot.intensity * lightingMul;
  }
  // Title and labels — regenerate textures with new color
  if (lobbyTitleMesh) {
    const tex = makeLobbyTitleTexture();
    if (lobbyTitleMesh.material.map) lobbyTitleMesh.material.map.dispose();
    lobbyTitleMesh.material.map = tex;
    lobbyTitleMesh.material.opacity = t.titleAlpha;
    lobbyTitleMesh.material.needsUpdate = true;
  }
  for (const lbl of seriesLabels) {
    const tex = makeLabelTexture(lbl.name, lbl.subtitle);
    if (lbl.mesh.material.map) lbl.mesh.material.map.dispose();
    lbl.mesh.material.map = tex;
    lbl.mesh.material.opacity = t.labelAlpha;
    lbl.mesh.material.needsUpdate = true;
  }
}

function setLightingMul(mul) {
  lightingMul = mul;
  const t = T();
  if (lightingRefs.ambient) lightingRefs.ambient.intensity = t.ambient.intensity * mul;
  if (lightingRefs.hemi) lightingRefs.hemi.intensity = t.hemi.intensity * mul;
  for (const g of lightingRefs.centerGlows) g.intensity = t.glow.intensity * mul;
  for (const s of lightingRefs.spots) s.intensity = t.spot.intensity * mul;
}

// Audio context — must be created/resumed during a user gesture for iOS Safari
let _audioCtx = null;
function ensureAudio() {
  if (!_audioCtx) {
    try {
      _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { return null; }
  }
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}

function playGunshot() {
  const ctx = ensureAudio(); if (!ctx) return;
  const t = ctx.currentTime;
  const bs = Math.floor(ctx.sampleRate * 0.18);
  const buf = ctx.createBuffer(1, bs, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bs; i++) {
    const env = Math.exp(-i / (ctx.sampleRate * 0.04));
    data[i] = (Math.random() * 2 - 1) * env;
  }
  const noise = ctx.createBufferSource(); noise.buffer = buf;
  const f = ctx.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(2000, t);
  f.frequency.exponentialRampToValueAtTime(400, t + 0.18);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.45, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.20);
  noise.connect(f).connect(g).connect(ctx.destination);
  noise.start(t); noise.stop(t + 0.22);
  const osc = ctx.createOscillator(); osc.type = 'sine';
  osc.frequency.setValueAtTime(120, t);
  osc.frequency.exponentialRampToValueAtTime(40, t + 0.08);
  const og = ctx.createGain();
  og.gain.setValueAtTime(0.3, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.10);
  osc.connect(og).connect(ctx.destination);
  osc.start(t); osc.stop(t + 0.12);
}

function playFire() {
  const ctx = ensureAudio(); if (!ctx) return;
  const t = ctx.currentTime;
  const bs = Math.floor(ctx.sampleRate * 0.5);
  const buf = ctx.createBuffer(1, bs, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bs; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.18));
  }
  const noise = ctx.createBufferSource(); noise.buffer = buf;
  const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.5;
  f.frequency.setValueAtTime(400, t);
  f.frequency.exponentialRampToValueAtTime(1800, t + 0.4);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  noise.connect(f).connect(g).connect(ctx.destination);
  noise.start(t); noise.stop(t + 0.5);
}

function playSoupThrow() {
  const ctx = ensureAudio(); if (!ctx) return;
  const t = ctx.currentTime;
  const bs = Math.floor(ctx.sampleRate * 0.25);
  const buf = ctx.createBuffer(1, bs, ctx.sampleRate);

  const g = ctx.createGain();

function playSoupSplat() {
  const ctx = ensureAudio(); if (!ctx) return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator(); osc.type = 'sine';
  osc.frequency.setValueAtTime(80, t);
  osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
  const og = ctx.createGain();
  og.gain.setValueAtTime(0.4, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  osc.connect(og).connect(ctx.destination);
  osc.start(t); osc.stop(t + 0.20);
  const bs = Math.floor(ctx.sampleRate * 0.15);

  for (let i = 0; i < bs; i++) {

/* Decals & projectiles */
const decals = [];          // splat/hole/burn meshes attached to surfaces
const projectiles = [];     // active soup cans in flight
const charredOriginals = new Map();   // painting -> {map, color} for restore

function makeSplatTexture(seed) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  // Random tomato-orange splat
  const cx = 128, cy = 128;
  const rng = (() => { let s = seed * 9301; return () => (s = (s * 9301 + 49297) % 233280) / 233280; })();
  ctx.fillStyle = '#c14a2a';
  // Main blob
  ctx.beginPath();
  for (let a = 0; a < Math.PI * 2; a += 0.1) {
    const r = 70 + rng() * 30;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    if (a === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill();
  // Drips
  for (let i = 0; i < 6; i++) {
    const a = rng() * Math.PI * 2;
    const r = 70 + rng() * 50;
    ctx.fillStyle = '#a04020';
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 6 + rng() * 8, 0, Math.PI * 2);
    ctx.fill();
  }
  // Highlight
  ctx.fillStyle = 'rgba(255, 220, 180, 0.4)';
  ctx.beginPath();
  ctx.arc(cx - 25, cy - 25, 22, 0, Math.PI * 2);
  ctx.fill();
  return new THREE.CanvasTexture(c);
}

function makeBulletHoleTexture() {
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  // Dark center + gradient ring
  const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 32);
  grad.addColorStop(0, '#000');
  grad.addColorStop(0.4, '#1a0a05');
  grad.addColorStop(0.7, 'rgba(40, 20, 10, 0.5)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 128, 128);
  // Cracks
  ctx.strokeStyle = 'rgba(20, 10, 5, 0.7)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    const a = Math.random() * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(64, 64);
    ctx.lineTo(64 + Math.cos(a) * 26, 64 + Math.sin(a) * 26);
    ctx.stroke();
  }
  return new THREE.CanvasTexture(c);
}

function spawnDecal(hit, type) {
  // Place a small plane decal on the hit surface, oriented to its normal
  const hitPos = hit.point;
  const normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  const size = type === 'splat' ? 0.6 : 0.18;
  let tex;
  if (type === 'splat') tex = makeSplatTexture(Math.random() * 1000);
  else if (type === 'hole') tex = makeBulletHoleTexture();
  if (!tex) return;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(size, size), mat);
  mesh.position.copy(hitPos).addScaledVector(normal, 0.005);
  mesh.lookAt(hitPos.clone().add(normal));
  scene.add(mesh);
  decals.push(mesh);
  updateClearButton();
}

function clearAllDamage() {
  // Stop any active burn first
  stopLighterBurn();
  // Restore charred paintings
  for (const d of decals) {
    if (d._restore) {
      const orig = charredOriginals.get(d._restore);
      if (orig) {
        if (d._restore.material.map && d._restore.material.map !== orig.map) {
          d._restore.material.map.dispose();
        }
        d._restore.material.map = orig.map;
        d._restore.material.color.copy(orig.color);
        d._restore.material.needsUpdate = true;
        charredOriginals.delete(d._restore);
        // Reset burn state so lighter starts over next time
        d._restore.userData.burnTime = 0;
        d._restore.userData.charCanvas = null;
        d._restore.userData.charCtx = null;
        d._restore.userData.charBase = null;
        d._restore.userData.charTex = null;
      }
    } else if (d._flame) {
      // Flame markers — actual flame mesh already removed by stopLighterBurn
      // (no-op here)
    } else if (d.parent) {
      scene.remove(d);
      if (d.material) {
        if (d.material.map) d.material.map.dispose();
        d.material.dispose();
      }
      if (d.geometry) d.geometry.dispose();
    }
  }
  decals.length = 0;
  updateClearButton();
}

function updateClearButton() {
  const btn = document.getElementById('clear-damage');
  if (!btn) return;
  btn.disabled = decals.length === 0;
  btn.title = decals.length > 0 ? 'Clear damage (' + decals.length + ')' : 'Clear damage';
}

function setWeapon(w) {

  document.querySelectorAll('.weapon-btn[data-weapon]').forEach(b => {
