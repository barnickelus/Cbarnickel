function fireSoup() {
  // Spawn a small can in front of camera, give it forward velocity + slight gravity
  const fx = -Math.sin(yaw) * Math.cos(pitch);
  const fy = -Math.sin(pitch);
  const fz = -Math.cos(yaw) * Math.cos(pitch);
  const start = camera.position.clone().add(new THREE.Vector3(fx, fy, fz).multiplyScalar(0.4));
  const canMat = new THREE.MeshStandardMaterial({ color: 0xc14a2a, roughness: 0.5, metalness: 0.4 });
  const can = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.10, 12), canMat);
  can.position.copy(start);
  can.rotation.x = Math.PI / 2;
  scene.add(can);
  projectiles.push({
    mesh: can,
    vel: new THREE.Vector3(fx * 13, fy * 13 + 1.4, fz * 13),
    spin: 8,
    age: 0,
    prevPos: start.clone(),
  });
  playSoupThrow();
}

function fireGun() {
  // Instant raycast from camera forward
  raycaster.setFromCamera({ x: 0, y: 0 }, camera);
  // Hit ANY solid surface (paintings, walls, floors, ceilings)
  const targets = [...paintingMeshes, ...wallMeshes, ...floorMeshes, ...ceilingMeshes];
  const hits = raycaster.intersectObjects(targets, false);
  if (hits.length > 0) {
    spawnDecal(hits[0], 'hole');
  }
  playGunshot();
}

/* ── Lighter: HELD-DOWN progressive burn ──
   Holding the lighter (mousedown / touchstart with lighter weapon) starts the
   flame. Each frame, while the user is aiming at a painting within range, we
   accumulate burn time. The painting's texture is progressively charred over
   BURN_DURATION seconds. Releasing or aiming away stops the flame; partial
   char is preserved. Switching weapons or toggling out of destruction mode
   also stops it. */

const BURN_DURATION = 18;   // seconds for full char
let lighterHeld = false;
let activeBurnPainting = null;

function startLighterBurn() {
  if (destruction.weapon !== 'lighter') return;
  lighterHeld = true;
  // Don't play sound here — we play it once we actually find a target
}

function stopLighterBurn() {
  lighterHeld = false;
  if (activeBurnPainting && activeBurnPainting.userData.flameMesh) {
    scene.remove(activeBurnPainting.userData.flameMesh);
    if (activeBurnPainting.userData.flameMesh.geometry) activeBurnPainting.userData.flameMesh.geometry.dispose();
    if (activeBurnPainting.userData.flameMesh.material) {
      if (activeBurnPainting.userData.flameMesh.material.map) activeBurnPainting.userData.flameMesh.material.map.dispose();
      activeBurnPainting.userData.flameMesh.material.dispose();
    }
    activeBurnPainting.userData.flameMesh = null;
  }
  activeBurnPainting = null;
}

// Replaces the old instant fireLighter. Now just initiates the held-burn
// (this function is wired to be called on mousedown/touchstart).
function fireLighter() {
  startLighterBurn();
}

function findLighterTargetPainting() {
  // Find painting in front of us within 2.6m, in view
  const fx = -Math.sin(yaw) * Math.cos(pitch);
  const fz = -Math.cos(yaw) * Math.cos(pitch);
  let best = null, bestDist = Infinity;
  for (const p of paintingMeshes) {
    const dx = p.position.x - camera.position.x;
    const dz = p.position.z - camera.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist > 2.6) continue;
    const dnx = dx / dist, dnz = dz / dist;
    const dot = fx * dnx + fz * dnz;
    if (dot < 0.55) continue;
    if (dist < bestDist) { bestDist = dist; best = p; }
  }
  return best;
}

// Per-frame update called from animate loop while in destruction mode
function updateLighterBurn(dt) {
  if (!lighterHeld || destruction.weapon !== 'lighter' || !destruction.active) {
    if (activeBurnPainting) stopLighterBurn();
    return;
  }
  const target = findLighterTargetPainting();
  if (!target) {
    if (activeBurnPainting) stopLighterBurn();
    return;
  }
  // Switch target painting if needed
  if (activeBurnPainting && activeBurnPainting !== target) {
    if (activeBurnPainting.userData.flameMesh) {
      scene.remove(activeBurnPainting.userData.flameMesh);
      activeBurnPainting.userData.flameMesh = null;
    }
  }
  activeBurnPainting = target;
  if (target.userData.burnTime === undefined) target.userData.burnTime = 0;
  target.userData.burnTime += dt;
  const frac = Math.min(1, target.userData.burnTime / BURN_DURATION);

  // Apply progressive char
  applyCharProgress(target, frac);

  // Spawn / update flame visual
  if (!target.userData.flameMesh) {
    const flame = makeFlameMesh();
    // Position at painting's lower edge, just in front of it
    const n = target.userData.outwardNormal;
    if (n) {
      flame.position.set(
        target.position.x + n.x * 0.06,
        target.position.y - 0.18,
        target.position.z + n.z * 0.06
      );
    } else {
      flame.position.copy(target.position);
    }
    flame.lookAt(camera.position);
    scene.add(flame);
    target.userData.flameMesh = flame;
    decals.push({ _flame: target });   // for clearAll
    updateClearButton();
    playFire();   // sound only on flame ignition
  } else {
    // Flicker
    const f = target.userData.flameMesh;
    const flick = 0.85 + Math.random() * 0.3;
    f.scale.set(flick, flick * (0.9 + Math.random() * 0.2), flick);
    f.lookAt(camera.position);
  }

  // If fully charred, kill the flame (job's done)
  if (frac >= 1) stopLighterBurn();
}

function makeFlameMesh() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 128, 256);
  const grad = ctx.createRadialGradient(64, 200, 8, 64, 200, 80);
  grad.addColorStop(0, 'rgba(255, 240, 180, 0.95)');
  grad.addColorStop(0.3, 'rgba(255, 180, 60, 0.78)');
  grad.addColorStop(0.7, 'rgba(220, 80, 20, 0.4)');
  grad.addColorStop(1, 'rgba(200, 60, 0, 0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(40, 240);
  ctx.quadraticCurveTo(20, 180, 50, 100);
  ctx.quadraticCurveTo(64, 60, 64, 30);
  ctx.quadraticCurveTo(64, 60, 78, 100);
  ctx.quadraticCurveTo(108, 180, 88, 240);
  ctx.closePath();
  ctx.fill();
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
  return new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.95), mat);
}

// Replaces the old single-shot applyCharring. Applies char in proportion to
// `frac` (0..1). Caches the original texture and a working canvas on the
// painting, then writes a fresh blended version each call.
function applyCharProgress(painting, frac) {
  // Preserve original on first call so we can restore on Clear
  if (!charredOriginals.has(painting)) {
    if (!painting.material.map || !painting.material.map.image || !painting.material.map.image.width) return;
    charredOriginals.set(painting, {
      map: painting.material.map,
      color: painting.material.color.clone(),
    });
  }
  // Initialize working canvas + base image on first call
  if (!painting.userData.charCanvas) {
    const origMap = charredOriginals.get(painting).map;
    const img = origMap.image;
    if (!img || !img.width) return;
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    painting.userData.charCanvas = c;
    painting.userData.charCtx = ctx;
    painting.userData.charBase = ctx.getImageData(0, 0, c.width, c.height);
    const newTex = new THREE.CanvasTexture(c);
    newTex.encoding = THREE.sRGBEncoding;
    painting.material.map = newTex;
    painting.material.needsUpdate = true;
    painting.userData.charTex = newTex;
    decals.push({ _restore: painting });   // marker so clearAll restores it
  }
  // Re-render current frame
  const ctx = painting.userData.charCtx;
  const c = painting.userData.charCanvas;
  const base = painting.userData.charBase;
  const out = ctx.createImageData(c.width, c.height);
  const od = out.data, bd = base.data;
  // Char target: dark red-brown, modulated by luminance
  const blend = frac * 0.95;   // 0..0.95
  for (let i = 0; i < bd.length; i += 4) {
    const r = bd[i], g = bd[i+1], b = bd[i+2];
    const lum = (r + g + b) / 3 / 255;   // 0..1
    const tR = 30 + lum * 40;
    const tG = 14 + lum * 18;
    const tB = 6 + lum * 8;
    od[i]   = (r * (1 - blend) + tR * blend) | 0;
    od[i+1] = (g * (1 - blend) + tG * blend) | 0;
    od[i+2] = (b * (1 - blend) + tB * blend) | 0;
    od[i+3] = bd[i+3];
  }
  ctx.putImageData(out, 0, 0);
  if (painting.userData.charTex) painting.userData.charTex.needsUpdate = true;
}

function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.age += dt;
    p.prevPos.copy(p.mesh.position);
    // Gravity
    p.vel.y -= 4.5 * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    p.mesh.rotation.z += p.spin * dt;
    p.mesh.rotation.y += p.spin * 0.7 * dt;
    // Raycast from prevPos to current
    const dir = p.mesh.position.clone().sub(p.prevPos);
    const segLen = dir.length();
    if (segLen > 0.001) {
      dir.normalize();
      const ray = new THREE.Raycaster(p.prevPos.clone(), dir, 0, segLen);
      const targets = [...paintingMeshes, ...wallMeshes, ...floorMeshes, ...ceilingMeshes];
      const hits = ray.intersectObjects(targets, false);
      if (hits.length > 0) {
        spawnDecal(hits[0], 'splat');
        playSoupSplat();
        scene.remove(p.mesh);
        if (p.mesh.geometry) p.mesh.geometry.dispose();
        if (p.mesh.material) p.mesh.material.dispose();
        projectiles.splice(i, 1);
        continue;
      }
    }
    if (p.age > 5 || p.mesh.position.y < -2) {
      scene.remove(p.mesh);
      if (p.mesh.geometry) p.mesh.geometry.dispose();
      if (p.mesh.material) p.mesh.material.dispose();
      projectiles.splice(i, 1);
    }
  }
}

/* ─── 12. UI wiring ─── */
function buildIndex() {
  const container = document.getElementById('index-container');
  container.innerHTML = '';
  // Group by series
  for (const sid of Object.keys(SERIES)) {
    const list = ARTWORKS.filter(a => a.series === sid);
    if (list.length === 0) continue;
    const meta = SERIES[sid];
    const section = document.createElement('div');
    section.className = 'index-section';
    section.innerHTML = `
      <div class="index-section-header">
        <div class="ornament"></div>
        <h3>${escapeHtml(meta.name)}</h3>
        ${meta.subtitle ? `<div class="sub">${escapeHtml(meta.subtitle)}</div>` : ''}
        <div class="count">${list.length} ${list.length === 1 ? 'work' : 'works'}</div>
      </div>
      <div class="index-grid"></div>`;
    const grid = section.querySelector('.index-grid');
    list.forEach(art => {
      const idx = ARTWORKS.indexOf(art);
      const card = document.createElement('div');
      card.className = 'index-card';
      card.innerHTML = `
        <div class="img-wrap"><img src="paintings/${art.file}" alt="${escapeHtml(art.title)}" loading="lazy"></div>
        <div class="num">${String(idx + 1).padStart(2, '0')}${art.year ? ' — ' + escapeHtml(art.year) : ''}</div>
        <h4>${escapeHtml(art.title)}</h4>
        ${art.medium ? `<div class="meta"><em>${escapeHtml(art.medium)}</em> · ${formatSize(art._size)}</div>` : ''}`;
      card.addEventListener('click', () => openModal(idx));
      grid.appendChild(card);
    });
    container.appendChild(section);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function openModal(idx) {
  const art = ARTWORKS[idx];
  if (!art) return;
  document.getElementById('modal-img').src = 'paintings/' + art.file;
  document.getElementById('modal-num').textContent = String(idx + 1).padStart(2, '0') + (art.year ? ' — ' + art.year : '');
  document.getElementById('modal-title').textContent = art.title || '';
  document.getElementById('modal-meta').textContent = art.medium || '';
  document.getElementById('modal-size').textContent = formatSize(art._size);
  document.getElementById('modal-desc').textContent = art.description || '';
  document.getElementById('modal').classList.add('show');
  document.getElementById('modal').dataset.idx = idx;
}
function closeModal() {
  document.getElementById('modal').classList.remove('show');
}
function modalNav(delta) {
  const m = document.getElementById('modal');
  let idx = parseInt(m.dataset.idx, 10) || 0;
  idx = (idx + delta + ARTWORKS.length) % ARTWORKS.length;
  openModal(idx);
}

let slideIdx = 0;
function openSlideshow() {
  document.getElementById('slideshow').classList.add('show');
  showSlide(0);
}
function closeSlideshow() {
  document.getElementById('slideshow').classList.remove('show');
}
function showSlide(i) {
  if (ARTWORKS.length === 0) return;
  slideIdx = (i + ARTWORKS.length) % ARTWORKS.length;
  const art = ARTWORKS[slideIdx];
  document.getElementById('slide-img').src = 'paintings/' + art.file;
  document.getElementById('slide-num').textContent = String(slideIdx + 1).padStart(2, '0') + (art.year ? ' — ' + art.year : '');
  document.getElementById('slide-title').textContent = art.title;
  document.getElementById('slide-meta').textContent = (art.medium || '') + (art._size ? ' · ' + formatSize(art._size) : '');
}

function setView(view) {
  document.getElementById('view-gallery').classList.toggle('active', view === 'gallery');
  document.getElementById('view-slideshow').classList.toggle('active', view === 'slideshow');
  document.getElementById('view-index').classList.toggle('active', view === 'index');
  const idx = document.getElementById('index-view');
  const slide = document.getElementById('slideshow');
  if (view === 'index') { idx.classList.add('show'); slide.classList.remove('show'); }
  else if (view === 'slideshow') { idx.classList.remove('show'); slide.classList.add('show'); showSlide(0); }
  else { idx.classList.remove('show'); slide.classList.remove('show'); }
}

function closeAllOverlays() {
  document.getElementById('modal').classList.remove('show');
  document.getElementById('settings-panel').classList.remove('show');
  document.getElementById('tutorial-overlay').classList.remove('show');
  document.getElementById('settings-btn').classList.remove('active');
}

function showTutorial() {
  const titleEl = document.getElementById('tutorial-title');
  const bodyEl = document.getElementById('tutorial-body');
  let title = 'How to navigate', steps = [];
  if (navMode === 'tap-pinch') {
    title = 'Tap + pinch';
    steps = hasTouch ? [
      { icon: '◉', text: '<strong>Tap a painting or floor</strong> to walk there.' },
      { icon: '↔', text: '<strong>Pinch out</strong> to walk forward, <strong>pinch in</strong> to walk back.' },
      { icon: '⇄', text: '<strong>Two-finger swipe</strong> sideways to step left/right.' },
      { icon: '✥', text: '<strong>Drag with one finger</strong> to look around.' },
      { icon: '◐', text: 'When you stop near a painting, the camera <strong>auto-positions</strong> for viewing.' },
    ] : [
      { icon: '◉', text: '<strong>Click a painting or floor</strong> to walk there.' },
      { icon: '↔', text: '<strong>Scroll wheel</strong> to walk forward / back.' },
      { icon: '✥', text: '<strong>Click and drag</strong> to look around.' },
      { icon: '⌨', text: '<strong>WASD or arrow keys</strong> also work.' },
    ];
  } else if (navMode === 'tap-art') {
    title = 'Tap art';
    steps = [
      { icon: '◉', text: '<strong>Tap any painting</strong> to walk up to it. Tap again when close to view details.' },
      { icon: '✥', text: 'Drag to look around.' },
    ];
  } else if (navMode === 'tap-any') {
    title = 'Tap anywhere';
    steps = [
      { icon: '◉', text: '<strong>Tap painting OR floor</strong> to walk to that spot.' },
      { icon: '✥', text: 'Drag to look around.' },
    ];
  } else {
    title = 'Classic';
    steps = hasTouch ? [
      { icon: '⊕', text: 'Use the <strong>joystick</strong> in the bottom-left to walk.' },
      { icon: '✥', text: '<strong>Drag the screen</strong> to look around.' },
      { icon: '◉', text: '<strong>Tap a painting</strong> to view details.' },
    ] : [
      { icon: '⌨', text: '<strong>WASD or arrows</strong> to walk.' },
      { icon: '✥', text: 'Click and drag to look.' },
      { icon: '◉', text: 'Click a painting to view details.' },
    ];
  }
  titleEl.textContent = title;
  bodyEl.innerHTML = steps.map(s =>
    `<div class="tutorial-step"><div class="step-icon">${s.icon}</div><div class="step-text">${s.text}</div></div>`
  ).join('');
  document.getElementById('tutorial-overlay').classList.add('show');
}

function wireUI() {
  // Settings gear
  const gear = document.getElementById('settings-btn');
  const panel = document.getElementById('settings-panel');
  gear.addEventListener('click', () => {
    const isOpen = panel.classList.toggle('show');
    gear.classList.toggle('active', isOpen);
  });
  // Outside-click close
  document.addEventListener('click', (e) => {
    if (panel.classList.contains('show')
        && !panel.contains(e.target)
        && !gear.contains(e.target)) {
      panel.classList.remove('show');
      gear.classList.remove('active');
    }
  });

  // Lighting slider
  const slider = document.getElementById('lighting-slider');
  slider.addEventListener('input', () => {
    const v = parseInt(slider.value, 10);
    document.getElementById('lighting-val').textContent = v + '%';
    setLightingMul(v / 100);
  });

  // White-cube toggle
  document.getElementById('white-toggle').addEventListener('click', () => {
    setTheme(theme === 'dark' ? 'white' : 'dark');
  });

  // Nav mode buttons
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.addEventListener('click', () => setNavMode(b.dataset.nav));
  });

  // Tutorial
  document.getElementById('show-tutorial').addEventListener('click', () => {
    panel.classList.remove('show');
    gear.classList.remove('active');
    showTutorial();
  });
  document.getElementById('tutorial-close').addEventListener('click', () => {
    document.getElementById('tutorial-overlay').classList.remove('show');
  });
  document.getElementById('tutorial-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'tutorial-overlay') {
      document.getElementById('tutorial-overlay').classList.remove('show');
    }
  });

  // Bait button
  document.getElementById('bait-btn').addEventListener('click', () => {
    setDestructionActive(!destruction.active);
  });

  // Weapons
  document.querySelectorAll('.weapon-btn[data-weapon]').forEach(b => {
    b.addEventListener('click', () => {
      if (!destruction.active) return;
      setWeapon(b.dataset.weapon);
    });
  });
  document.getElementById('clear-damage').addEventListener('click', clearAllDamage);

  // View toggle
  document.getElementById('view-gallery').addEventListener('click', () => setView('gallery'));
  document.getElementById('view-slideshow').addEventListener('click', () => setView('slideshow'));
  document.getElementById('view-index').addEventListener('click', () => setView('index'));

  // Modal
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-prev').addEventListener('click', () => modalNav(-1));
  document.getElementById('modal-next').addEventListener('click', () => modalNav(1));
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal') closeModal();
  });

  // Slideshow nav
  document.getElementById('slide-prev').addEventListener('click', () => showSlide(slideIdx - 1));
  document.getElementById('slide-next').addEventListener('click', () => showSlide(slideIdx + 1));

  // Skip intro
  document.getElementById('skip-intro').addEventListener('click', () => {
    if (intro.active) endIntro();
  });

  // Entry
  document.getElementById('enter-btn').addEventListener('click', enterGallery);
}

function enterGallery() {
  ensureAudio();   // critical: must call from user gesture for iOS
  const entry = document.getElementById('entry');
  entry.classList.add('fade');
  setTimeout(() => entry.style.display = 'none', 800);
  entered = true;
  // Show joystick now if we're in classic mode (otherwise the bottom-hint takes its place)
  if (navMode === 'classic' && hasTouch) {
    document.getElementById('joy').classList.add('show');
  }
  startIntro();
}

/* ─── 13. Animate loop ─── */
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  if (intro.active) {
    updateIntro(now);
  } else if (snapTween) {
    updateSnap(now);
    timeSinceInput += dt;
  } else {
    timeSinceInput += dt;

    // Tap-walk
    if (tapWalkTarget) updateTapWalk(dt);

    // WASD / joystick
    let mx = 0, mz = 0;
    if (keys.w) mz -= 1;
    if (keys.s) mz += 1;
    if (keys.a) mx -= 1;
    if (keys.d) mx += 1;
    mx += joyVec.x;
    mz += joyVec.y;
    const len = Math.hypot(mx, mz);
    if (len > 1) { mx /= len; mz /= len; }
    if (mx !== 0 || mz !== 0) {
      tapWalkTarget = null;
      const sin = Math.sin(yaw), cos = Math.cos(yaw);
      const dx = (mx * cos + mz * sin) * WALK_SPEED * dt;
      const dz = (-mx * sin + mz * cos) * WALK_SPEED * dt;
      const c = clampToRooms(camera.position.x + dx, camera.position.z + dz);
      camera.position.x = c.x;
      camera.position.z = c.z;
      currentRoomId = c.roomId;
      noteUserInput();
    }

    // Magnetic snap — when idle near a painting
    if (timeSinceInput > SNAP_IDLE_TIME && !destruction.active && !tapWalkTarget) {
      const cand = findSnapCandidate();
      if (cand) startSnapTo(cand);
    }
    // Reset last-snapped tracking once we walk away from it
    if (lastSnappedPainting) {
      const dxL = lastSnappedPainting.position.x - camera.position.x;
      const dzL = lastSnappedPainting.position.z - camera.position.z;
      if (Math.hypot(dxL, dzL) > SNAP_TRIGGER_DIST + 0.5) {
        lastSnappedPainting = null;
      }
    }
  }

  // Apply yaw/pitch to camera rotation
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  // Projectile physics
  if (projectiles.length > 0) updateProjectiles(dt);
  // Lighter held-down progressive burn
  if (destruction.active && destruction.weapon === 'lighter') updateLighterBurn(dt);

  renderer.render(scene, camera);
}

/* ─── 14. Boot ─── */
async function boot() {
  let data;
  try {
    data = await loadGalleryData();
  } catch (err) {
    document.getElementById('enter-btn').textContent = 'Failed to load';
    console.error(err);
    return;
  }
  ARTWORKS = data.paintings;
  SERIES = data.series;
  if (ARTWORKS.length === 0) {
    document.getElementById('enter-btn').textContent = 'No paintings';
    return;
  }
  initScene();
  buildGallery();
  placeAllPaintings();
  buildIndex();
  wireUI();
  setNavMode('tap-pinch');   // default
  attachInputHandlers();
  // Position camera at intro start to avoid a wall-flash before intro animation
  const k0 = intro.keyframes[0];
  camera.position.set(k0.pos.x, k0.pos.y, k0.pos.z);
  yaw = k0.yaw; pitch = k0.pitch;
  lastTime = performance.now();
  animate();
  // Mark loaded
  const entry = document.getElementById('entry');
  entry.classList.add('loaded');
  const btn = document.getElementById('enter-btn');
  btn.disabled = false;
  btn.textContent = 'Enter the gallery';
}

boot();
